      </div>

      <div className="card" style={{padding:24,marginBottom:16}}>
        <h3 style={{margin:'0 0 6px',fontSize:16}}>Sample Bow-Tie Question</h3>
        <p style={{color:'var(--text3)',fontSize:13,marginBottom:16}}>Identify the condition, causes, and nursing actions simultaneously.</p>
        <div style={{background:'#f0f9ff',borderRadius:6,padding:'14px 16px',marginBottom:16,border:'1px solid #bae6fd'}}>
          <p style={{margin:0,fontWeight:600,fontSize:14,lineHeight:1.75,color:'var(--navy)'}}>A 68-year-old client is admitted with sudden-onset dyspnea. VS: BP 88/52, HR 126, RR 28, SpO2 84% on room air. The client is diaphoretic and using accessory muscles. Lung sounds reveal bilateral crackles.</p>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr auto 1fr',gap:12,alignItems:'start'}}>
          <div style={{background:'var(--red-bg)',border:'1px solid var(--red-b)',borderRadius:6,padding:14}}>

          <div style={{textAlign:'center',paddingTop:32}}>

            ['Passing Standard','NCSBN logit-based passing standard. Similar difficulty level to pre-2023 NCLEX. Maintained to ensure same competency threshold.'],
            ['Unfolding Case Studies','Same client, 6 questions tracking clinical progression. Each question builds on prior information. New with NGN format.']
          ].map(([t,d])=>(
            <div key={t} style={{background:'rgba(255,255,255,0.08)',borderRadius:6,padding:14}}>
              <div style={{fontWeight:700,color:'#c4b5fd',marginBottom:5,fontSize:12}}>{t}</div>
              <div style={{fontSize:12,color:'#e0e7ff',lineHeight:1.7}}>{d}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const [view, setView] = useState('dashboard');
  const [sessions, setSessions] = useState(()=>S.get('nclex_sessions',[]));
  const [savedQs, setSavedQs] = useState(()=>S.get('nclex_saved_q',[]));
  const [notes, setNotes] = useState(()=>S.get('nclex_notes',{}));
  const [apiKey, setApiKey] = useState(()=>S.get('nclex_key','')||HARDCODED_KEY||'');
  const [quizCfg, setQuizCfg] = useState(null);
  const [quizResult, setQuizResult] = useState(null);
  const [mobOpen, setMobOpen] = useState(false);
  const [weakArea, setWeakArea] = useState(()=>S.get('nclex_weak_area',null));

  const inQuiz = view==='quiz';

  const startQuiz = cfg => {
    setQuizCfg({...cfg, apiKey:cfg.apiKey||apiKey||HARDCODED_KEY});
    setQuizResult(null);
    setView('quiz');
  };

  const onQuizDone = (session, questions, answers, flagged) => {
    setSessions(p=>{const u=[...p,session];S.set('nclex_sessions',u);return u;});
    setQuizResult({session,questions,answers,flagged});
    setView('review');
  };

  const onDiagComplete = (weak, scores) => {
    setWeakArea(weak);
    S.set('nclex_weak_area', weak);
  };

  const drillCat = id => {
    setQuizCfg({mode:'Tutor',count:15,cats:[id],apiKey:apiKey||HARDCODED_KEY});
    setView('builder');
  };

  const nav = v => { setView(v); setMobOpen(false); };

  return (
    <div>
      {!inQuiz && (
        <>
          <Sidebar view={view} setView={nav} sessions={sessions} open={mobOpen} />
          <button className="mob-menu" onClick={()=>setMobOpen(o=>!o)}>☰</button>
          {mobOpen && <div onClick={()=>setMobOpen(false)} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.4)',zIndex:190}} />}
        </>
      )}
      <div className={inQuiz?'':'main'}>
        {view==='dashboard' && <Dashboard sessions={sessions} setView={nav} onDrillCat={drillCat} />}
        {view==='builder' && <TestBuilder onStart={startQuiz} apiKey={apiKey} setApiKey={setApiKey} initialConfig={quizCfg} />}
        {view==='quiz' && quizCfg && <QuizView config={quizCfg} onComplete={onQuizDone} savedQs={savedQs} setSavedQs={setSavedQs} notes={notes} setNotes={setNotes} />}
        {view==='review' && quizResult && <ReviewView {...quizResult} onNewTest={()=>nav('builder')} onRetake={()=>startQuiz(quizCfg)} />}
        {view==='analytics' && <Analytics sessions={sessions} />}
        {view==='saved' && <SavedQuestions saved={savedQs} setSaved={setSavedQs} notes={notes} />}
        {view==='diagnostic' && <DiagnosticView onComplete={onDiagComplete} setView={nav} />}
        {view==='studyplan' && <StudyPlanView weakArea={weakArea} setView={nav} />}
        {view==='ngn' && <NGNGuide />}
        {view==='california' && <CaliforniaGuide />}
        {view==='strategy' && <StrategyGuide />}
        {view==='settings' && <Settings apiKey={apiKey} setApiKey={setApiKey} />}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
