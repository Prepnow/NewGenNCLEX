function NCLEXPrep() {
  const [tab, setTab] = useState("home");
  const [diagnosisState, setDiagnosisState] = useState({ started: false, qIndex: 0, answers: {}, done: false, scores: {} });
  const [practiceState, setPracticeState] = useState({ started: false, qIndex: 0, answers: {}, done: false, showResult: null });
  const [selectedPracticeQ, setSelectedPracticeQ] = useState(null);
  const [weakArea, setWeakArea] = useState(null);

  // ── SCORE CALCULATOR ─────────────────────────────────
  const calcDiagScores = (answers) => {
    const scores = {};
    CATEGORIES.forEach(c => { scores[c.id] = { correct: 0, total: 0 }; });
    DIAGNOSTIC_QUESTIONS.forEach(q => {
      if (answers[q.id] !== undefined) {
        scores[q.cat].total++;
        if (answers[q.id] === q.correct) scores[q.cat].correct++;
      }
    });
    return scores;
  };

  const finishDiag = (answers) => {
    const scores = calcDiagScores(answers);
    setDiagnosisState(s => ({ ...s, done: true, scores }));
    let worst = null, worstPct = 1;
    Object.entries(scores).forEach(([id, v]) => {
      if (v.total > 0) {
        const pct = v.correct / v.total;
        if (pct < worstPct) { worstPct = pct; worst = id; }
      }
    });
    setWeakArea(worst);
    setTab("plan");
  };

  // ── HOME TAB ──────────────────────────────────────────
  const HomeTab = () => (
    <div style={{ maxWidth: 900, margin: "0 auto" }}>

        <p style={{ color: "#6b7280", fontSize: 13, margin: "0 0 18px" }}>Bow-tie questions ask you to identify the condition, causes, and nursing actions simultaneously</p>

          <p style={{ margin: "0 0 12px", fontWeight: 600, fontSize: 14 }}>
            A 68-year-old client is admitted with reports of sudden-onset dyspnea. VS: BP 88/52, HR 126, RR 28, SpO2 84% on room air. The client is diaphoretic and using accessory muscles. Lung sounds reveal bilateral crackles.
          </p>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr auto 1fr", gap: 12, alignItems: "start" }}>
          <div style={{ background: "#fef2f2", border: "1px solid #fca5a5", borderRadius: 10, padding: 14 }}>
            <div style={{ fontWeight: 700, color: "#dc2626", fontSize: 12, marginBottom: 8 }}>POTENTIAL CONDITIONS (causes)</div>
            {["Acute pulmonary edema", "Pneumothorax", "Pulmonary embolism"].map((c, i) => (
              <div key={c} style={{ padding: "8px 10px", background: i === 0 ? "#dc262622" : "#fff", borderRadius: 6, marginBottom: 6, fontSize: 13, border: i === 0 ? "1px solid #dc2626" : "1px solid #e5e7eb", color: i === 0 ? "#dc2626" : "#374151", fontWeight: i === 0 ? 700 : 400 }}>
                {i === 0 && "✓ "}{c}
              </div>
            ))}
          </div>
          <div style={{ textAlign: "center", paddingTop: 40 }}>
            <div style={{ background: "#111827", color: "#fff", borderRadius: 10, padding: "10px 14px", fontWeight: 700, fontSize: 13 }}>Priority Condition</div>
            <div style={{ fontSize: 22, margin: "8px 0" }}></div>
            <div style={{ background: "#0f2744", color: "#fff", borderRadius: 8, padding: "6px 10px", fontSize: 12, fontWeight: 600 }}>Acute Pulmonary Edema / Cardiogenic Shock</div>
          </div>
          <div style={{ background: "#f0fdf4", border: "1px solid #bbf7d0", borderRadius: 10, padding: 14 }}>
            <div style={{ fontWeight: 700, color: "#166534", fontSize: 12, marginBottom: 8 }}>NURSING ACTIONS</div>
            {["Elevate HOB, apply high-flow O2", "Administer IV furosemide as ordered", "Prepare for possible intubation", "Insert urinary catheter for I&O"].map((a, i) => (
              <div key={a} style={{ padding: "8px 10px", background: "#f0fdf4", borderRadius: 6, marginBottom: 6, fontSize: 13, border: "1px solid #bbf7d0", color: "#166534" }}>
                ✓ {a}

      {/* Scoring */}
      <div style={{ background: "#0f2744", borderRadius: 8, padding: 22, color: "#fff" }}>
        <h3 style={{ margin: "0 0 14px", fontWeight: 700 }}>NGN Scoring & Passing Standard</h3>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
          {[
            ["Partial Credit Scoring", "NGN uses partial credit for multi-part items. Getting 3 of 6 options correct = partial score. NOT all-or-nothing like traditional SATA."],
            ["Adaptive Testing", "Still uses CAT (Computer Adaptive Testing). Minimum 85, maximum 150 questions. Exam stops when pass/fail is determined with 95% confidence."],
            ["Passing Standard", "NCSBN sets the logit-based passing standard. As of 2023 NGN launch, passing standard maintained similar difficulty levels to previous format."],
            ["Standalone vs Case Study", "Standalone: 1 scenario, 1 question. Unfolding case study: same client, 6 questions tracking clinical progression over time. New with NGN."]
          ].map(([t, d]) => (
            <div key={t} style={{ background: "rgba(255,255,255,0.1)", borderRadius: 10, padding: 14 }}>
              <div style={{ fontWeight: 700, color: "#c4b5fd", marginBottom: 6, fontSize: 13 }}>{t}</div>
              <div style={{ fontSize: 12, color: "#e0e7ff", lineHeight: 1.7 }}>{d}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );

  // ── AI QUESTIONS TAB ──────────────────────────────────
  const AIQuestionsTab = () => {
    const { useState: useLocalState } = React;
    const [apiKey, setApiKey] = useLocalState(HARDCODED_API_KEY || "");
    const [keyEntered, setKeyEntered] = useLocalState(!!HARDCODED_API_KEY);
    const [selectedCats, setSelectedCats] = useLocalState(() => {
      // Pre-select weak areas if diagnostic is done
      if (diagnosisState.done && weakArea) return [weakArea];
      return [];
    });
    const [count, setCount] = useLocalState(15);
    const [loading, setLoading] = useLocalState(false);
    const [error, setError] = useLocalState("");
    const [questions, setQuestions] = useLocalState([]);
    const [answers, setAnswers] = useLocalState({});
    const [revealed, setRevealed] = useLocalState({});
    const [sessionDone, setSessionDone] = useLocalState(false);

    const diagDone = diagnosisState.done;
    const diagScores = diagnosisState.scores;

    const toggleCat = (id) => {
      setSelectedCats(prev =>
        prev.includes(id) ? prev.filter(c => c !== id) : [...prev, id]
      );
    };

    const getCatScore = (id) => {
      if (!diagDone || !diagScores[id] || diagScores[id].total === 0) return null;
      return Math.round((diagScores[id].correct / diagScores[id].total) * 100);
    };

    const generateQuestions = async () => {
      if (selectedCats.length === 0) { setError("Select at least one category."); return; }
      if (!apiKey.trim()) { setError("Enter your Anthropic API key to generate questions."); return; }
      setError("");
      setLoading(true);
      setQuestions([]);
      setAnswers({});
      setRevealed({});
      setSessionDone(false);

      const catLabels = selectedCats.map(id => CATEGORIES.find(c => c.id === id)?.label).join(", ");
      const diagContext = diagDone
        ? `The student just completed a diagnostic test. Their scores: ${selectedCats.map(id => {
            const s = diagScores[id];
            if (!s || s.total === 0) return null;
            return `${CATEGORIES.find(c=>c.id===id)?.label}: ${Math.round(s.correct/s.total*100)}%`;
          }).filter(Boolean).join(", ")}. Generate questions that target concepts the student is likely struggling with based on these low scores.`
        : "Generate challenging NCLEX-style questions for a nursing student preparing for the NCLEX-RN exam.";

      const prompt = `You are an expert NCLEX-RN question writer. ${diagContext}

Generate exactly ${count} NCLEX-RN style multiple choice questions focused on: ${catLabels}.

Rules:
- Each question must be realistic, clinical, scenario-based
- 4 answer options each (A-D), only ONE correct answer
- Include a detailed rationale (3-5 sentences) explaining why the correct answer is right AND why the distractors are wrong
- Include a short test-taking strategy tip (1-2 sentences)
- Vary difficulty: mix moderate and hard questions
- Use NGN clinical judgment language where appropriate

Respond ONLY with valid JSON, no markdown, no backticks, no extra text. Format:
{
  "questions": [
    {
      "id": 1,
      "category": "category name",
      "stem": "Clinical scenario and question",
      "options": ["Option A text", "Option B text", "Option C text", "Option D text"],
      "correct": 0,
      "rationale": "Full rationale explaining correct answer and why others are wrong.",
      "strategy": "Test-taking tip."
    }
  ]
}`;

      try {
        const res = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-api-key": apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
          body: JSON.stringify({
            model: "claude-sonnet-4-20250514",
            max_tokens: 8000,
            messages: [{ role: "user", content: prompt }]
          })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData?.error?.message || `API error ${res.status}`);
        }

        const data = await res.json();
        const text = data.content?.find(b => b.type === "text")?.text || "";
        const clean = text.replace(/```json|```/g, "").trim();
        const parsed = JSON.parse(clean);
        setQuestions(parsed.questions || []);
      } catch (e) {
        setError("Error: " + e.message);
      } finally {
        setLoading(false);
      }
    };

    const selectAnswer = (qId, idx) => {
      if (revealed[qId]) return;
      setAnswers(prev => ({ ...prev, [qId]: idx }));
    };

    const revealAnswer = (qId) => {
      if (answers[qId] === undefined) return;
      setRevealed(prev => ({ ...prev, [qId]: true }));
    };

    const revealAll = () => {
      const allRevealed = {};
      questions.forEach(q => { if (answers[q.id] !== undefined) allRevealed[q.id] = true; });
      setRevealed(allRevealed);
      setSessionDone(true);
    };

    const score = questions.filter(q => revealed[q.id] && answers[q.id] === q.correct).length;
    const attempted = questions.filter(q => revealed[q.id]).length;

    return (
      <div style={{ maxWidth: 820, margin: "0 auto" }}>

        {/* Header */}
        <div style={{ background: "#0f2744", borderRadius: 8, padding: "28px 32px", marginBottom: 24, color: "#fff", borderLeft: "4px solid #c97d1a" }}>
          <div style={{ fontSize: 11, letterSpacing: 3, opacity: 0.6, textTransform: "uppercase", marginBottom: 6 }}>AI-Powered</div>
          <h2 style={{ margin: "0 0 8px", fontSize: 24, fontWeight: 700, fontFamily: "'Libre Baskerville', serif" }}>Personalized Practice Questions</h2>
          <p style={{ margin: 0, opacity: 0.8, fontSize: 14, lineHeight: 1.6 }}>
            Claude generates fresh NCLEX questions targeting your weakest categories — different every time, calibrated to your diagnostic results.
          </p>
        </div>

        {/* API Key Entry */}
        {!keyEntered ? (
          <div style={{ background: "#fff", border: "1px solid #dde3ec", borderRadius: 8, padding: 28, marginBottom: 24 }}>
            <h3 style={{ margin: "0 0 6px", fontFamily: "'Libre Baskerville', serif", color: "#0f2744" }}>Enter Your Anthropic API Key</h3>
            <p style={{ margin: "0 0 16px", fontSize: 13, color: "#4a5a72", lineHeight: 1.6 }}>
              This feature uses the Claude API to generate questions. Your key is used only in your browser and never stored or sent anywhere except Anthropic's servers.
              Get a free key at <a href="https://console.anthropic.com" target="_blank" style={{ color: "#0d7377" }}>console.anthropic.com</a>.
            </p>
            <div style={{ display: "flex", gap: 10 }}>
              <input
                type="password"
                placeholder="sk-ant-..."
                value={apiKey}
                onChange={e => setApiKey(e.target.value)}
                onKeyDown={e => e.key === "Enter" && apiKey.startsWith("sk-") && setKeyEntered(true)}
                style={{ flex: 1, padding: "10px 14px", border: "1px solid #dde3ec", borderRadius: 6, fontSize: 14, fontFamily: "'Karla', sans-serif", outline: "none", color: "#0f2744" }}
              />
              <button
                onClick={() => { if (apiKey.startsWith("sk-")) setKeyEntered(true); else setError("Key should start with sk-ant-"); }}
                style={{ background: "#0f2744", color: "#fff", border: "none", borderRadius: 6, padding: "10px 20px", fontWeight: 700, cursor: "pointer", fontSize: 13, letterSpacing: "0.04em", fontFamily: "'Karla', sans-serif" }}>
                Continue
              </button>
            </div>
            {error && <div style={{ marginTop: 10, color: "#b91c1c", fontSize: 13 }}>{error}</div>}
          </div>
        ) : (
          <>
            {/* Config Panel */}
            <div style={{ background: "#fff", border: "1px solid #dde3ec", borderRadius: 8, padding: 24, marginBottom: 20 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
                <h3 style={{ margin: 0, fontFamily: "'Libre Baskerville', serif", color: "#0f2744", fontSize: 16 }}>Configure Your Session</h3>
                <button onClick={() => setKeyEntered(false)} style={{ background: "none", border: "none", color: "#8294a8", fontSize: 12, cursor: "pointer", textDecoration: "underline" }}>Change API Key</button>
              </div>

              {/* Diagnostic banner */}
              {diagDone ? (
                <div style={{ background: "#f0fdf4", border: "none", borderLeft: "3px solid #166534", borderRadius: "0 6px 6px 0", padding: "10px 14px", marginBottom: 18, fontSize: 13, color: "#166534" }}>
                  Diagnostic complete — weak areas are pre-selected below. Claude will calibrate question difficulty to your scores.
                </div>
              ) : (
                <div style={{ background: "#fffbf0", border: "none", borderLeft: "3px solid #c97d1a", borderRadius: "0 6px 6px 0", padding: "10px 14px", marginBottom: 18, fontSize: 13, color: "#92400e" }}>
                  Tip: Complete the Diagnostic Test first so AI questions are tailored to your weak areas.
                </div>
              )}

              {/* Category selector */}
              <div style={{ marginBottom: 18 }}>
                <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: "#4a5a72", marginBottom: 10 }}>Select Categories to Practice</div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                  {CATEGORIES.map(c => {
                    const catScore = getCatScore(c.id);
                    const isWeak = catScore !== null && catScore < 60;
                    const isSelected = selectedCats.includes(c.id);
                    return (
                      <button key={c.id} onClick={() => toggleCat(c.id)} style={{
                        display: "flex", alignItems: "center", gap: 10, padding: "10px 14px",
                        background: isSelected ? "#0f2744" : "#f4f6f9",
                        border: isSelected ? "1px solid #0f2744" : "1px solid #dde3ec",
                        borderRadius: 6, cursor: "pointer", textAlign: "left", transition: "all 0.15s",
                        fontFamily: "'Karla', sans-serif"
                      }}>
                        <div style={{ width: 8, height: 8, borderRadius: "50%", background: isSelected ? "#c97d1a" : c.color, flexShrink: 0 }} />
                        <div style={{ flex: 1 }}>
                          <div style={{ fontSize: 12, fontWeight: 600, color: isSelected ? "#fff" : "#0f2744" }}>{c.label}</div>
                          {catScore !== null && (
                            <div style={{ fontSize: 11, color: isSelected ? "rgba(255,255,255,0.6)" : (isWeak ? "#b91c1c" : "#166534") }}>
                              Diagnostic: {catScore}%{isWeak ? " — needs work" : ""}
                            </div>
                          )}
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Question count */}
              <div style={{ marginBottom: 20 }}>
                <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: "#4a5a72", marginBottom: 10 }}>Number of Questions</div>
                <div style={{ display: "flex", gap: 8 }}>
                  {[15, 20, 30, 50].map(n => (
                    <button key={n} onClick={() => setCount(n)} style={{
                      padding: "8px 18px", border: count === n ? "2px solid #0f2744" : "1px solid #dde3ec",
                      borderRadius: 6, background: count === n ? "#0f2744" : "#fff",
                      color: count === n ? "#fff" : "#4a5a72", cursor: "pointer", fontWeight: 700, fontSize: 14,
                      fontFamily: "'Karla', sans-serif"
                    }}>{n}</button>
                  ))}
                </div>
              </div>

              {error && <div style={{ marginBottom: 12, color: "#b91c1c", fontSize: 13, padding: "8px 12px", background: "#fef2f2", borderRadius: 6 }}>{error}</div>}

              <button onClick={generateQuestions} disabled={loading} style={{
                width: "100%", background: loading ? "#8294a8" : "#c97d1a", color: "#fff", border: "none",
                borderRadius: 6, padding: "14px", fontWeight: 700, cursor: loading ? "not-allowed" : "pointer",
                fontSize: 14, letterSpacing: "0.05em", textTransform: "uppercase", fontFamily: "'Karla', sans-serif",
                transition: "background 0.2s"
              }}>
                {loading ? "Generating Questions..." : `Generate ${count} AI Questions`}
              </button>
            </div>

            {/* Loading state */}
            {loading && (
              <div style={{ background: "#fff", border: "1px solid #dde3ec", borderRadius: 8, padding: 40, textAlign: "center" }}>
                <div style={{ width: 40, height: 40, border: "3px solid #dde3ec", borderTopColor: "#0f2744", borderRadius: "50%", margin: "0 auto 16px", animation: "spin 0.8s linear infinite" }} />
                <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>
                <div style={{ fontSize: 15, color: "#0f2744", fontWeight: 600, marginBottom: 6 }}>Claude is writing your questions...</div>
                <div style={{ fontSize: 13, color: "#8294a8" }}>Calibrating to your diagnostic results</div>
              </div>
            )}

            {/* Questions */}
            {questions.length > 0 && (
              <div>
                {/* Score summary if session done */}
                {sessionDone && (
                  <div style={{ background: "#0f2744", borderRadius: 8, padding: "20px 24px", marginBottom: 20, color: "#fff", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                    <div>
                      <div style={{ fontSize: 11, letterSpacing: 3, opacity: 0.6, textTransform: "uppercase", marginBottom: 4 }}>Session Complete</div>
                      <div style={{ fontSize: 28, fontWeight: 700, fontFamily: "'Libre Baskerville', serif" }}>
                        {score} / {questions.length} <span style={{ fontSize: 16, opacity: 0.7, fontFamily: "'Karla', sans-serif" }}>({Math.round(score/questions.length*100)}%)</span>
                      </div>
                    </div>
                    <button onClick={generateQuestions} style={{ background: "#c97d1a", color: "#fff", border: "none", borderRadius: 6, padding: "10px 20px", fontWeight: 700, cursor: "pointer", fontSize: 13, letterSpacing: "0.04em", fontFamily: "'Karla', sans-serif" }}>
                      New Set
                    </button>
                  </div>
                )}

                {questions.map((q, i) => {
                  const userAns = answers[q.id];
                  const isRevealed = revealed[q.id];
                  const isCorrect = userAns === q.correct;
                  return (
                    <div key={q.id} style={{ background: "#fff", border: "1px solid #dde3ec", borderRadius: 8, padding: 24, marginBottom: 16, borderTop: isRevealed ? `3px solid ${isCorrect ? "#166534" : "#b91c1c"}` : "3px solid #dde3ec" }}>
                      <div style={{ display: "flex", gap: 10, marginBottom: 12, alignItems: "center" }}>
                        <span style={{ fontSize: 11, fontWeight: 700, color: "#8294a8", letterSpacing: "0.06em", textTransform: "uppercase" }}>Q{i + 1}</span>
                        <span style={{ fontSize: 11, background: "#f4f6f9", color: "#4a5a72", borderRadius: 4, padding: "2px 8px", fontWeight: 600 }}>{q.category}</span>
                        {isRevealed && (
                          <span style={{ fontSize: 11, fontWeight: 700, color: isCorrect ? "#166534" : "#b91c1c", marginLeft: "auto" }}>
                            {isCorrect ? "Correct" : "Incorrect"}
                          </span>
                        )}
                      </div>

                      <p style={{ margin: "0 0 16px", fontSize: 15, color: "#0f2744", lineHeight: 1.7, fontWeight: 500 }}>{q.stem}</p>

                      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
                        {q.options.map((opt, idx) => {
                          let bg = "#f4f6f9", border = "1px solid #dde3ec", color = "#0f2744";
                          if (userAns === idx && !isRevealed) { bg = "#e8eef7"; border = "1px solid #0f2744"; }
                          if (isRevealed && idx === q.correct) { bg = "#f0fdf4"; border = "1px solid #166534"; color = "#166534"; }
                          if (isRevealed && userAns === idx && idx !== q.correct) { bg = "#fef2f2"; border = "1px solid #b91c1c"; color = "#b91c1c"; }
                          return (
                            <button key={idx} onClick={() => selectAnswer(q.id, idx)} style={{
                              display: "flex", alignItems: "flex-start", gap: 10, padding: "11px 14px",
                              background: bg, border, borderRadius: 6, cursor: isRevealed ? "default" : "pointer",
                              textAlign: "left", fontFamily: "'Karla', sans-serif", transition: "all 0.1s"
                            }}>
                              <span style={{ fontWeight: 700, color, fontSize: 13, minWidth: 18, flexShrink: 0 }}>
                                {String.fromCharCode(65 + idx)}.
                              </span>
                              <span style={{ fontSize: 14, color, lineHeight: 1.5 }}>{opt}</span>
                            </button>
                          );
                        })}
                      </div>

                      {!isRevealed ? (
                        <button onClick={() => revealAnswer(q.id)} disabled={userAns === undefined} style={{
                          background: userAns === undefined ? "#f4f6f9" : "#0f2744",
                          color: userAns === undefined ? "#8294a8" : "#fff",
                          border: "none", borderRadius: 6, padding: "9px 18px", fontWeight: 700,
                          cursor: userAns === undefined ? "not-allowed" : "pointer", fontSize: 13,
                          letterSpacing: "0.04em", fontFamily: "'Karla', sans-serif"
                        }}>
                          Check Answer
                        </button>
                      ) : (
                        <div>
                          <div style={{ background: "#f0fdf4", borderLeft: "3px solid #166534", borderRadius: "0 6px 6px 0", padding: "12px 16px", marginBottom: 8, fontSize: 13, color: "#166534", lineHeight: 1.7 }}>
                            <strong>Rationale:</strong> {q.rationale}
                          </div>
                          <div style={{ background: "#eff6ff", borderLeft: "3px solid #1e40af", borderRadius: "0 6px 6px 0", padding: "10px 16px", fontSize: 12, color: "#1e40af", lineHeight: 1.6 }}>
                            <strong>Strategy:</strong> {q.strategy}
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}

                {!sessionDone && (
                  <button onClick={revealAll} style={{
                    width: "100%", background: "#f4f6f9", color: "#0f2744", border: "1px solid #dde3ec",
                    borderRadius: 6, padding: "12px", fontWeight: 700, cursor: "pointer", fontSize: 13,
                    letterSpacing: "0.04em", textTransform: "uppercase", fontFamily: "'Karla', sans-serif", marginTop: 8
                  }}>
                    Submit All & See Results
                  </button>
                )}
              </div>
            )}
          </>
        )}
      </div>
    );
  };

  // ── TAB NAVIGATION ────────────────────────────────────
  const TABS = [
    { id: "home", label: "Home" },
    { id: "diag", label: "Diagnostic" },
    { id: "practice", label: "Practice" },
    { id: "ai", label: "AI Questions" },
    { id: "strategy", label: "Strategies" },
    { id: "plan", label: "Study Plan" },
    { id: "california", label: "California" },
    { id: "ngn", label: "NGN Guide" }
  ];

  return (
    <div style={{ minHeight: "100vh", background: "var(--slate)", fontFamily: "'Karla', sans-serif" }}>
      {/* Top Bar */}
      <div style={{ background: "#0f2744", borderBottom: "none", position: "sticky", top: 0, zIndex: 100 }}>
        <div style={{ maxWidth: 960, margin: "0 auto", padding: "0 16px" }}>
          <div style={{ display: "flex", alignItems: "center", overflowX: "auto", gap: 2, padding: "12px 0" }}>
            {TABS.map(t => (
              <button key={t.id} onClick={() => setTab(t.id)}
                style={{ padding: "9px 16px", border: "none", borderRadius: 6, cursor: "pointer", fontWeight: tab === t.id ? 700 : 500, fontSize: 13, whiteSpace: "nowrap", letterSpacing: "0.02em", textTransform: "uppercase", background: tab === t.id ? "#c97d1a" : "transparent", color: tab === t.id ? "#fff" : "rgba(255,255,255,0.55)", transition: "all 0.15s", fontFamily: "'Karla', sans-serif" }}>
                {t.label}
              </button>
            ))}
          </div>
        </div>
      </div>

      {/* Content */}
      <div style={{ maxWidth: 960, margin: "0 auto", padding: "32px 20px 80px" }}>
        {tab === "home" && <HomeTab />}
        {tab === "diag" && <DiagTab />}
        {tab === "practice" && <PracticeTab />}
        {tab === "ai" && <AIQuestionsTab />}
        {tab === "strategy" && <StrategyTab />}
        {tab === "plan" && <PlanTab />}
        {tab === "california" && <CaliforniaTab />}
        {tab === "ngn" && <NGNTab />}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<NCLEXPrep />);
</script>
</body>
</html>
