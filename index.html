<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NCLEX-RN Pro | California</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Karla:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    :root {
      --navy: #0f2744; --navy-l: #1a3a5c; --teal: #0d7377; --amber: #c97d1a;
      --slate: #f0f4f8; --white: #fff; --border: #dde3ec;
      --text: #0f2744; --text2: #4a5a72; --text3: #8294a8;
      --green: #166534; --green-bg: #f0fdf4; --green-b: #bbf7d0;
      --red: #b91c1c; --red-bg: #fef2f2; --red-b: #fca5a5;
      --yellow: #92400e; --yellow-bg: #fffbf0;
      --sw: 220px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body { font-family: 'Karla', sans-serif; background: var(--slate); color: var(--text); line-height: 1.5; }
    h1,h2,h3,h4 { font-family: 'Libre Baskerville', serif; line-height: 1.3; }
    button { font-family: 'Karla', sans-serif; cursor: pointer; }
    input, textarea, select { font-family: 'Karla', sans-serif; }
    a { color: var(--teal); }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: #c0cdd8; border-radius: 3px; }

    .sidebar {
      position: fixed; left: 0; top: 0; height: 100vh; width: var(--sw);
      background: var(--navy); display: flex; flex-direction: column;
      overflow-y: auto; z-index: 200; border-right: 1px solid rgba(255,255,255,0.06);
    }
    .main { margin-left: var(--sw); min-height: 100vh; }
    .nav-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 18px 10px 16px;
      color: rgba(255,255,255,0.5); font-size: 13px; font-weight: 500;
      border: none; background: none; width: 100%; text-align: left;
      transition: all 0.15s; border-left: 3px solid transparent; letter-spacing: 0.01em;
    }
    .nav-item:hover { color: rgba(255,255,255,0.85); background: rgba(255,255,255,0.04); }
    .nav-item.active { color: #fff; background: rgba(255,255,255,0.07); border-left-color: var(--amber); }
    .nav-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.25); padding: 18px 18px 5px; }
    .card { background: #fff; border: 1px solid var(--border); border-radius: 8px; }
    .btn { border: none; border-radius: 6px; padding: 9px 18px; font-weight: 700; font-size: 13px; letter-spacing: 0.03em; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px; }
    .btn-navy { background: var(--navy); color: #fff; }
    .btn-navy:hover { background: var(--navy-l); }
    .btn-amber { background: var(--amber); color: #fff; }
    .btn-amber:hover { background: #b86f14; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text2); }
    .btn-ghost:hover { border-color: #b8c4d4; background: #f8fafc; }
    .btn-danger { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-b); }
    .opt-btn {
      display: flex; align-items: flex-start; gap: 12px; padding: 13px 16px;
      border-radius: 6px; border: 1.5px solid var(--border); background: #fff;
      cursor: pointer; text-align: left; width: 100%;
      transition: border-color 0.1s, background 0.1s; font-family: 'Karla', sans-serif;
    }
    .opt-btn:hover:not(:disabled) { border-color: #b8c4d4; background: #fafbfc; }
    .opt-btn.sel { border-color: var(--navy); background: #edf2f9; }
    .opt-btn.right { border-color: var(--green); background: var(--green-bg); }
    .opt-btn.wrong { border-color: var(--red); background: var(--red-bg); }
    .tag { display: inline-flex; align-items: center; background: #f0f4f8; color: var(--text2); border-radius: 4px; padding: 2px 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.02em; }
    .pbar { height: 6px; background: #e8eef5; border-radius: 3px; overflow: hidden; }
    .pfill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { width: 38px; height: 38px; border: 3px solid #e8eef5; border-top-color: var(--navy); border-radius: 50%; animation: spin 0.75s linear infinite; }
    @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .fade-in { animation: fade-in 0.25s ease both; }
    textarea { resize: vertical; border: 1px solid var(--border); border-radius: 6px; padding: 9px 12px; font-size: 13px; color: var(--text); width: 100%; outline: none; line-height: 1.6; }
    textarea:focus { border-color: var(--navy); box-shadow: 0 0 0 2px rgba(15,39,68,0.08); }
    select { border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; font-size: 13px; color: var(--text); outline: none; background: #fff; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { padding: 8px 12px; text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); border-bottom: 2px solid #f0f4f8; }
    td { padding: 10px 12px; border-bottom: 1px solid #f5f7fa; color: var(--text2); }
    .num-flag { width: 30px; height: 30px; border-radius: 5px; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid var(--border); background: #f0f4f8; color: var(--text3); transition: all 0.1s; }
    .num-flag.cur { background: var(--navy); color: #fff; border-color: var(--navy); }
    .num-flag.ans { background: #e8eef5; color: var(--navy); border-color: #c0cdd8; }
    .num-flag.flg { background: var(--yellow-bg); color: var(--amber); border-color: #e8c97a; }
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); transition: transform 0.22s; }
      .sidebar.open { transform: none; }
      .main { margin-left: 0; }
      .mob-menu { display: flex !important; }
    }
    .mob-menu { display: none; position: fixed; top: 12px; left: 12px; z-index: 300; background: var(--navy); color: #fff; border: none; border-radius: 6px; padding: 8px 13px; font-size: 18px; line-height: 1; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ─── CONFIG ──────────────────────────────────────────────────────────────────
// Paste your Anthropic key here to skip the key prompt for all users:
const HARDCODED_KEY = "sk-ant-api03-o3d...agAA";

// ─── DATA ────────────────────────────────────────────────────────────────────
const CATS = [
  { id:"mgmt",   label:"Management of Care",          color:"#0891b2", pct:"17-23%" },
  { id:"safety", label:"Safety & Infection Control",  color:"#0e7490", pct:"9-15%"  },
  { id:"health", label:"Health Promotion",            color:"#0d9488", pct:"6-12%"  },
  { id:"psycho", label:"Psychosocial Integrity",      color:"#7c3aed", pct:"6-12%"  },
  { id:"basic",  label:"Basic Care & Comfort",        color:"#b45309", pct:"6-12%"  },
  { id:"pharma", label:"Pharmacological Therapies",   color:"#dc2626", pct:"13-19%" },
  { id:"risk",   label:"Reduction of Risk Potential", color:"#c2410c", pct:"9-15%"  },
  { id:"physio", label:"Physiological Adaptation",    color:"#166534", pct:"11-17%" },
];

// ─── DIAGNOSTIC & PRACTICE QUESTIONS ─────────────────────────────────────────
const DIAG_QS = [
  {id:1,cat:"pharma",stem:"A nurse is preparing to administer digoxin 0.125 mg PO to an adult client. Before administering the medication, the nurse assesses the client's apical pulse and obtains a rate of 54 beats/min. Which action should the nurse take?",options:["Administer the medication as prescribed","Hold the medication and notify the provider","Administer half the prescribed dose","Reassess the pulse in 30 minutes"],correct:1,rationale:"Digoxin should be HELD and the provider notified when the apical pulse is below 60 bpm in adults. The drug slows the heart rate; giving it with bradycardia risks dangerous bradycardia or heart block. Always hold digoxin at <60 bpm (adult), <70 bpm (child), <90 bpm (infant).",strategy:"SAFETY FIRST: Digoxin parameters – hold <60 bpm adult. HIGH-YIELD pharmacology fact."},
  {id:2,cat:"mgmt",stem:"A charge nurse must assign four clients to a licensed practical nurse (LPN). Which client assignment is MOST appropriate?",options:["A newly admitted client with acute respiratory distress","A client 2 hours post-op after a coronary artery bypass graft","A client with a stable, chronic wound requiring daily dressing changes","A client receiving IV push medications every 4 hours"],correct:2,rationale:"LPNs are appropriate for stable clients with predictable outcomes. A stable chronic wound dressing change is within LPN scope. LPNs cannot perform initial assessments on unstable clients, care for fresh post-op CABG patients, or administer IV push medications.",strategy:"DELEGATION: RN=Unstable/complex/assessment/IV push. LPN=Stable/chronic/predictable. UAP=Basic ADLs only."},
  {id:3,cat:"physio",stem:"A nurse is caring for a client in diabetic ketoacidosis (DKA). Which laboratory finding is the nurse's priority concern?",options:["Blood glucose 480 mg/dL","Serum potassium 2.8 mEq/L","Arterial pH 7.28","Serum sodium 130 mEq/L"],correct:1,rationale:"Hypokalemia (K+ 2.8 mEq/L) is the PRIORITY because DKA treatment (insulin, fluids) drives potassium INTO cells, worsening hypokalemia rapidly, which can cause fatal cardiac dysrhythmias. K+ must be replaced before or concurrent with insulin if K+ < 3.5.",strategy:"In DKA, watch K+ closely. Insulin causes K+ to shift intracellularly. K+ < 3.5 = HOLD insulin, give K+ first."},
  {id:4,cat:"safety",stem:"A nurse is caring for a client who has C. difficile infection. Which personal protective equipment (PPE) should the nurse wear when providing care?",options:["Gloves only","Gloves and gown","Gloves, gown, and surgical mask","Gloves, gown, and N95 respirator"],correct:1,rationale:"C. difficile requires Contact Precautions: gloves AND gown. A mask is NOT required unless there is a splash risk. CRITICAL: Alcohol-based hand sanitizers are INEFFECTIVE against C. diff spores – use soap and water.",strategy:"Contact=gown+gloves (C.diff, MRSA, VRE). Droplet=mask. Airborne=N95. C.diff=SOAP not alcohol gel!"},
  {id:5,cat:"psycho",stem:"A nurse is caring for a client who states, 'I've been thinking about ending my life.' Which response by the nurse is BEST?",options:["\"I'll need to tell your family about this immediately.\"","\"Have you thought about how you might do this?\"","\"Why would you want to do something like that?\"","\"I'm sure things will get better. Let's focus on the positive.\""],correct:1,rationale:"Assessing for a specific plan (method, means, intent, timeline) is the PRIORITY when a client expresses suicidal ideation. A specific plan indicates higher lethality risk and guides intervention.",strategy:"SUICIDAL IDEATION: Always assess PLAN (how, when, means). Specific plan = high risk = immediate safety measures."},
  {id:6,cat:"basic",stem:"A nurse is caring for a client with a nasogastric (NG) tube. Before administering a tube feeding, which action should the nurse take FIRST?",options:["Aspirate and measure gastric residual volume","Flush the tube with 30 mL of water","Verify tube placement by x-ray confirmation","Elevate the head of the bed to 45 degrees"],correct:2,rationale:"X-ray confirmation is the GOLD STANDARD for verifying NG tube placement. Before each feeding, verify by checking for pH <5 of aspirate and confirming the external marking. Placement verification before the feeding is the first priority.",strategy:"NG TUBE SAFETY: X-ray=gold standard (initial). Before each feeding=check pH<5 + external marking. NEVER test placement by air auscultation alone."},
  {id:7,cat:"risk",stem:"A nurse is reviewing morning laboratory results for a client who is post-operative day 1 following a bowel resection. Which finding requires immediate intervention?",options:["Hemoglobin 10.2 g/dL","Serum sodium 136 mEq/L","WBC count 11,500/mm³","INR 4.8"],correct:3,rationale:"INR 4.8 is critically elevated (therapeutic anticoagulation ~2-3). Post-operative, this dramatically increases hemorrhage risk and requires immediate intervention: hold anticoagulants, notify provider, anticipate reversal agents like Vitamin K or FFP.",strategy:"CRITICAL LABS: INR >3 = bleeding risk. Platelets <50,000 = bleeding risk. K+ <3.0 or >6.0 = cardiac risk."},
  {id:8,cat:"health",stem:"A nurse is providing discharge teaching to a client who had a total hip replacement. Which instruction is MOST important to prevent dislocation?",options:["Avoid crossing your legs at the knees","Sleep on the operative side for comfort","Bend at the waist no more than 120 degrees","Use a regular toilet seat at home"],correct:0,rationale:"After total hip replacement (posterior approach), the client must NEVER cross legs, never flex hip >90 degrees, and never internally rotate the hip. Crossing legs adducts the hip and risks dislocation.",strategy:"HIP REPLACEMENT: No hip flexion >90°, no internal rotation, no adduction. Use raised toilet seat, abduction pillow."},
  {id:9,cat:"pharma",stem:"A nurse is preparing to administer morphine 4 mg IV to a client for post-operative pain. The client's respiratory rate is 10 breaths/min and oxygen saturation is 92%. Which action should the nurse take?",options:["Administer the morphine as prescribed","Administer half the dose and reassess","Hold the morphine and notify the provider","Apply supplemental oxygen and then administer the morphine"],correct:2,rationale:"Opioids cause respiratory depression. A respiratory rate of 10 (normal 12-20) and O2 sat of 92% indicate respiratory compromise. Administering morphine would worsen this. Hold and notify provider immediately. Have naloxone (Narcan) available.",strategy:"OPIOID PARAMETERS: Hold if RR <12. Hold if O2 sat <95%. Have naloxone ready."},
  {id:10,cat:"mgmt",stem:"A nurse discovers that a colleague administered the wrong medication to a client. The client is stable and denies any symptoms. What is the nurse's PRIORITY action?",options:["Complete an incident report","Assess the client and monitor for adverse effects","Notify the nursing supervisor","Document the medication error in the client's chart"],correct:1,rationale:"Client safety is ALWAYS the first priority. Assessing the client and monitoring for adverse effects is the immediate priority. After assessment, notify the provider, complete an incident report, and document in the chart. Incident reports are NOT documented in the client's chart.",strategy:"MED ERROR PRIORITY: 1) Assess client 2) Notify provider 3) Notify supervisor 4) Complete incident report 5) Document in chart."},
  {id:11,cat:"physio",stem:"A client who had a thyroidectomy 6 hours ago develops numbness and tingling around the mouth and carpopedal spasms. The nurse suspects hypocalcemia. Which finding would CONFIRM this complication?",options:["Positive Homans' sign","Positive Chvostek's sign","Positive Babinski reflex","Positive McBurney's point"],correct:1,rationale:"Chvostek's sign (facial muscle twitching when tapping the facial nerve near the ear) and Trousseau's sign (carpopedal spasm when BP cuff inflated >systolic for 3 minutes) are classic signs of hypocalcemia. After thyroidectomy, parathyroid glands may be damaged causing hypoparathyroidism.",strategy:"POST-THYROIDECTOMY: Watch for airway obstruction, hypocalcemia (Chvostek's/Trousseau's), thyroid storm. Keep calcium gluconate at bedside."},
  {id:12,cat:"safety",stem:"A nurse is caring for a client who is mechanically ventilated. During suctioning, the client's oxygen saturation drops to 84% and the client becomes bradycardic. Which action should the nurse take FIRST?",options:["Continue suctioning to clear the airway","Increase the FiO2 on the ventilator","Stop suctioning and hyperoxygenate the client","Notify the respiratory therapist"],correct:2,rationale:"STOP suctioning immediately and provide hyperoxygenation (100% O2 for 30-60 seconds). Suctioning removes oxygen along with secretions and can cause hypoxia and vagal stimulation causing bradycardia. Never suction for more than 10-15 seconds.",strategy:"SUCTIONING: Max 10-15 seconds. Hyperoxygenate BEFORE and AFTER. If O2 drops or bradycardia → STOP immediately."},
  {id:13,cat:"psycho",stem:"A nurse is caring for a client with schizophrenia who states, 'The TV is sending me messages to hurt people.' Which nursing response is THERAPEUTIC?",options:["\"The TV cannot send personal messages to anyone.\"","\"Tell me more about what you are experiencing.\"","\"Those messages aren't real – it's your illness talking.\"","\"Let's watch something different to take your mind off it.\""],correct:1,rationale:"Using a non-confrontational, exploratory response allows the nurse to assess the extent of the delusion and any associated command hallucinations. Arguing about reality or dismissing delusions is non-therapeutic and increases agitation.",strategy:"DELUSIONS: Do NOT argue, reinforce, or dismiss. DO assess safety (command hallucinations?). DO use therapeutic communication."},
  {id:14,cat:"pharma",stem:"A nurse is teaching a client who has a new prescription for warfarin (Coumadin). Which statement by the client indicates a need for further teaching?",options:["\"I will take aspirin if I get a headache.\"","\"I will report any unusual bleeding to my doctor.\"","\"I need to keep my vitamin K intake consistent.\"","\"I will tell my dentist I take blood thinners before any procedure.\""],correct:0,rationale:"Aspirin combined with warfarin dramatically increases bleeding risk. The client should use acetaminophen (Tylenol) for pain relief, not aspirin or NSAIDs. Consistent vitamin K intake is correct. Informing dental providers is correct.",strategy:"WARFARIN: No aspirin/NSAIDs (use Tylenol). Consistent vitamin K. Regular INR monitoring. Antidote = Vitamin K."},
  {id:15,cat:"risk",stem:"A nurse is caring for a client who had a percutaneous coronary intervention (PCI) via the right femoral artery 2 hours ago. The client reports feeling wet around the right groin dressing. What is the nurse's PRIORITY assessment?",options:["Check blood pressure bilaterally","Assess the dressing site for bleeding or hematoma","Review the post-procedure orders","Check the client's coagulation studies"],correct:1,rationale:"Feeling 'wet' around the femoral access site after PCI suggests active bleeding or hematoma at the femoral artery puncture site. This can lead to massive hemorrhage. Priority: immediately assess the site.",strategy:"POST-PCI: Keep extremity STRAIGHT. Check access site q15min x4. Report: bleeding, hematoma, absent pulse, limb coolness."},
  {id:16,cat:"basic",stem:"A nurse is caring for a client with stage III pressure injury on the sacrum. Which intervention is MOST appropriate?",options:["Massage the reddened area around the wound to improve circulation","Apply a wet-to-dry dressing and change every 8 hours","Use a moisture-retentive dressing to maintain a moist wound environment","Irrigate the wound with full-strength hydrogen peroxide daily"],correct:2,rationale:"Moist wound healing is the evidence-based standard. Moisture-retentive dressings promote granulation. Massaging reddened areas INCREASES damage. Wet-to-dry removes healthy tissue. Hydrogen peroxide is cytotoxic.",strategy:"WOUND CARE: Moist environment = best healing. NEVER massage reddened bony prominences. Reposition every 2 hours."},
  {id:17,cat:"mgmt",stem:"A nurse is reviewing the rights of a client who is refusing a blood transfusion for religious reasons. The client is alert, oriented, and has decision-making capacity. Which action should the nurse take?",options:["Obtain a court order to proceed with the transfusion","Contact the hospital ethics committee immediately","Document the refusal and respect the client's decision","Ask the family to convince the client to accept the transfusion"],correct:2,rationale:"A competent adult client has the absolute right to refuse any medical treatment, including blood transfusions, even if it may result in death. This is the ethical principle of autonomy and legal right to self-determination.",strategy:"AUTONOMY: Competent adults can refuse ANY treatment. Document informed refusal. Respect decision even if life-threatening."},
  {id:18,cat:"pharma",stem:"A client with type 1 diabetes is prescribed insulin glargine (Lantus). Which instruction should the nurse include in the teaching?",options:["Mix the insulin with regular insulin for better coverage","Administer the insulin at the same time each day","Shake the vial vigorously before drawing the dose","Store opened vials in the freezer between uses"],correct:1,rationale:"Insulin glargine (Lantus) is a long-acting insulin administered once daily at the SAME TIME each day for consistent blood glucose levels. It should NEVER be mixed with other insulins. Do NOT shake (causes denaturation) – gently roll. Store at room temperature once opened.",strategy:"INSULIN GLARGINE (Lantus): Long-acting, once daily, SAME TIME. Never mix. Never shake. Rotate sites."},
  {id:19,cat:"health",stem:"A nurse is caring for a client who has anorexia nervosa with a current weight of 82 pounds (BMI 12.8). The client states, 'I'm actually fat – I need to lose more weight.' Which nursing response is BEST?",options:["\"You are dangerously underweight and need to eat more.\"","\"I can see you feel that way. Let's talk about what's going on.\"","\"Your BMI shows you are severely malnourished.\"","\"Your perception of your body is distorted by your illness.\""],correct:1,rationale:"For clients with anorexia nervosa, therapeutic communication acknowledges feelings without directly confronting the distorted body image. Directly contradicting the distortion creates resistance. The nurse acknowledges the client's experience while redirecting to underlying feelings.",strategy:"ANOREXIA: Do not argue about weight/body image. Acknowledge feelings. Monitor for refeeding syndrome during treatment. Priority: medical stabilization first."},
  {id:20,cat:"physio",stem:"A client with a spinal cord injury at T4 suddenly develops severe headache (9/10), profuse diaphoresis above the injury, and BP 192/104. What should the nurse do FIRST?",options:["Administer prescribed antihypertensive medication","Sit the client upright and check for a full bladder or bowel","Apply supplemental oxygen and notify the physician","Assess neurological status including pupil response"],correct:1,rationale:"This is autonomic dysreflexia – a hypertensive emergency in clients with SCI at T6 or above. FIRST: sit the client UPRIGHT (lowers BP by orthostatic mechanism) and find/remove the trigger. Most common triggers: distended bladder (80%), impacted bowel.",strategy:"AUTONOMIC DYSREFLEXIA: SCI at/above T6. Signs: severe HA, diaphoresis ABOVE injury, hypertension. FIRST: sit upright, find trigger. MEDICAL EMERGENCY."}
];

const PRACTICE_QS = [
  {id:101,cat:"pharma",stem:"A nurse is preparing to administer a blood transfusion to a client. Fifteen minutes into the transfusion, the client develops chills, low back pain, and a temperature of 101.8°F. Which action should the nurse take FIRST?",options:["Slow the transfusion rate to 20 mL/hr","Stop the transfusion and keep the IV open with normal saline","Administer diphenhydramine (Benadryl) IV as ordered","Notify the blood bank"],correct:1,rationale:"STOP the transfusion IMMEDIATELY – these are signs of a hemolytic transfusion reaction (incompatible blood), which can be fatal. Keep the IV line open with NORMAL SALINE (not the blood tubing) to maintain access. Notify provider and blood bank, save the blood bag.",strategy:"TRANSFUSION REACTION: STOP immediately. Keep IV open with NS. Notify provider and blood bank. Save the blood bag. Monitor for DIC and renal failure."},
  {id:102,cat:"psycho",stem:"A nurse is caring for a client prescribed lithium for bipolar disorder. The client reports coarse tremors, confusion, and has had three episodes of vomiting. Which action is the PRIORITY?",options:["Encourage the client to increase sodium and fluid intake","Hold the next dose and notify the provider immediately","Administer the next dose as scheduled","Reassure the client these are common side effects"],correct:1,rationale:"Coarse tremors, confusion, and vomiting are signs of lithium TOXICITY (therapeutic range 0.6-1.2 mEq/L). Toxic level >1.5 mEq/L. Hold the dose and notify provider immediately for a STAT lithium level.",strategy:"LITHIUM TOXICITY: Early = fine tremor, N/V, diarrhea. Late = coarse tremor, ataxia, confusion. Na+ depletion → lithium toxicity. Antidote: none – supportive care, dialysis for severe cases."},
  {id:103,cat:"mgmt",stem:"A nurse in the emergency department receives four clients simultaneously. Which client should be assessed FIRST?",options:["A 45-year-old with chest pain radiating to the left arm and diaphoresis","A 28-year-old with a 2-inch laceration on the forearm","A 60-year-old with stable COPD and O2 sat of 91%","A 35-year-old with a blood glucose of 220 mg/dL"],correct:0,rationale:"Chest pain radiating to the left arm with diaphoresis indicates a potential myocardial infarction – an immediately life-threatening emergency. This client is emergent and requires immediate ECG within 10 minutes and possible cath lab activation.",strategy:"TRIAGE PRIORITY: ABCs + life-threatening conditions first. Chest pain + diaphoresis = possible MI = EMERGENT. STEMI door-to-balloon time goal: <90 minutes."},
  {id:104,cat:"risk",stem:"A nurse is caring for a client receiving IV vancomycin when the client develops flushing, erythema, and pruritus on the face, neck, and upper torso. What should the nurse do FIRST?",options:["Stop the infusion and notify the provider","Slow the infusion rate","Administer diphenhydramine IV","Apply cool compresses to the affected areas"],correct:1,rationale:"These are signs of Red Man Syndrome, a non-allergic infusion reaction to vancomycin. It is NOT anaphylaxis. The intervention is to SLOW (not stop) the infusion rate and administer diphenhydramine. Stopping would be the action for a true allergic reaction.",strategy:"RED MAN SYNDROME (vancomycin): Slow the infusion, give diphenhydramine, premedicate next time. NOT anaphylaxis – DO NOT stop. Infuse over at least 60 minutes."},
  {id:105,cat:"safety",stem:"A nurse is educating a student nurse about fall prevention. Which action by the student nurse requires IMMEDIATE correction?",options:["Placing the call light within the client's reach","Raising all four side rails after assisting a confused client","Using a night light in the client's room","Ensuring non-slip footwear is available"],correct:1,rationale:"Raising ALL FOUR side rails is considered a form of restraint and is not appropriate for fall prevention. It can actually increase fall risk if the confused client attempts to climb over the rails. Only upper two side rails may be raised for positioning; this is not a restraint.",strategy:"FALL PREVENTION: 2 upper side rails = positioning aid (not restraint). 4 side rails = RESTRAINT. Restraints require MD order and monitoring every 2 hours."},
  {id:106,cat:"physio",stem:"A nurse is assessing a client with increased intracranial pressure (ICP). Which finding indicates Cushing's Triad?",options:["Tachycardia, hypotension, and tachypnea","Bradycardia, hypertension with widened pulse pressure, and irregular respirations","Tachycardia, hypertension, and deep regular respirations","Bradycardia, hypotension, and Cheyne-Stokes respirations"],correct:1,rationale:"Cushing's Triad is a LATE and ominous sign of severely elevated ICP indicating imminent brain herniation: (1) Bradycardia, (2) Hypertension with widened pulse pressure, (3) Irregular respirations. This is a neurological emergency.",strategy:"CUSHING'S TRIAD: Bradycardia + HTN (wide pulse pressure) + Irregular respirations = BRAIN HERNIATION IMMINENT. HOB 30-45°, neutral neck, avoid hypercapnia."},

const S = {
  get: (k, d=null) => { try { const v=localStorage.getItem(k); return v!==null?JSON.parse(v):d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del: (k) => { try { localStorage.removeItem(k); } catch {} }
};
const hash = s => { let h=0; for(let i=0;i<Math.min(s.length,80);i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;} return h.toString(36); };
const fmt_time = s => `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`;
const fmt_date = iso => new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric'});
const cat_label = id => CATS.find(c=>c.id===id)?.label || id;
const score_color = p => p>=70?'#166534':p>=50?'#b45309':'#b91c1c';

        {pct!==null && (

            <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
              <span style={{fontSize:10,color:'rgba(255,255,255,0.35)',letterSpacing:2,textTransform:'uppercase'}}>Overall</span>

// ─── DASHBOARD ───────────────────────────────────────────────────────────────
function Dashboard({ sessions, setView, onDrillCat }) {
  const tQ = sessions.reduce((a,s)=>a+(s.total||0),0);
  const tC = sessions.reduce((a,s)=>a+(s.score||0),0);
  const pct = tQ>0?Math.round(tC/tQ*100):0;
  const catStats = {};
  CATS.forEach(c=>{catStats[c.id]={correct:0,total:0};});
  sessions.forEach(s=>(s.questions||[]).forEach(q=>{
    if(catStats[q.cat]){catStats[q.cat].total++;if(q.correct)catStats[q.cat].correct++;}
  }));
  const recent = [...sessions].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5);
  const today = new Date(); today.setHours(0,0,0,0);
  let streak=0;
  for(let i=0;i<60;i++){
    const d=new Date(today); d.setDate(d.getDate()-i);
    if(sessions.some(s=>{const sd=new Date(s.date);sd.setHours(0,0,0,0);return sd.getTime()===d.getTime();}))streak++;
    else if(i>0)break;
  }

  if(!sessions.length) return (
    <div style={{maxWidth:680,margin:'0 auto',padding:'40px 24px'}} className="fade-in">
      <div className="card" style={{padding:'36px 40px',borderLeft:'4px solid var(--amber)',marginBottom:20,background:'var(--navy)',color:'#fff',border:'none'}}>
        <div style={{fontSize:10,letterSpacing:3,opacity:0.5,textTransform:'uppercase',marginBottom:8}}>Welcome to</div>
        <h1 style={{fontSize:28,marginBottom:12,color:'#fff'}}>NCLEX-RN Pro</h1>
        <p style={{opacity:0.75,fontSize:15,lineHeight:1.75,marginBottom:24,maxWidth:460}}>
          AI-powered, unlimited practice questions. Performance tracked across every session. Calibrated to your weakest categories.
        </p>
        <button className="btn btn-amber" style={{fontSize:14,padding:'12px 28px'}} onClick={()=>setView('builder')}>Start Your First Test</button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
        {[
          {t:'Unlimited Questions',d:'AI generates fresh NCLEX questions each session — you will never exhaust the bank.'},
          {t:'Three Test Modes',d:'Tutor (immediate feedback), Timed practice, or full 45-question Exam Simulation.'},
          {t:'Performance Tracking',d:'Every session saved. Category-level analytics and score trend over time.'},
          {t:'Personalized Drilling',d:'One-click drill buttons appear for any category below 60%. AI calibrates difficulty.'},
        ].map(f=>(
          <div key={f.t} className="card" style={{padding:'18px 20px'}}>
            <div style={{fontWeight:700,fontSize:13,color:'var(--navy)',marginBottom:5}}>{f.t}</div>
            <div style={{fontSize:12,color:'var(--text2)',lineHeight:1.65}}>{f.d}</div>
          </div>
        ))}
      </div>
    </div>
  );

  const weak = CATS.filter(c=>{const s=catStats[c.id];return s.total>=3&&(s.correct/s.total)<0.6;})
    .sort((a,b)=>(catStats[a.id].correct/catStats[a.id].total)-(catStats[b.id].correct/catStats[b.id].total));

  return (
    <div style={{maxWidth:960,margin:'0 auto',padding:'32px 24px'}} className="fade-in">
      <h2 style={{fontSize:19,marginBottom:22,color:'var(--navy)'}}>Dashboard</h2>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:14,marginBottom:22}}>
        {[
          {l:'Questions Answered',v:tQ,c:'var(--navy)'},
          {l:'Overall Score',v:`${pct}%`,c:score_color(pct)},
          {l:'Tests Completed',v:sessions.length,c:'var(--teal)'},
          {l:'Day Streak',v:streak,c:'var(--amber)'},
        ].map(s=>(
          <div key={s.l} className="card" style={{padding:'16px',textAlign:'center',borderTop:`3px solid ${s.c}`}}>
            <div style={{fontSize:26,fontWeight:800,color:s.c,fontFamily:"'Libre Baskerville',serif",lineHeight:1}}>{s.v}</div>
            <div style={{fontSize:10,color:'var(--text3)',fontWeight:700,marginTop:5,textTransform:'uppercase',letterSpacing:'0.05em'}}>{s.l}</div>
          </div>
        ))}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,marginBottom:20}}>
        <div className="card" style={{padding:22}}>
          <div style={{fontSize:13,fontWeight:700,color:'var(--navy)',marginBottom:16}}>Performance by Category</div>
          {CATS.map(c=>{
            const s=catStats[c.id]; const p=s.total>0?Math.round(s.correct/s.total*100):null;
            return (
              <div key={c.id} style={{display:'flex',alignItems:'center',gap:10,marginBottom:9}}>
                <div style={{width:126,fontSize:11,color:'var(--text2)',flexShrink:0,lineHeight:1.3}}>{c.label}</div>
                <div style={{flex:1}}><div className="pbar"><div className="pfill" style={{width:p?`${p}%`:'0%',background:p?score_color(p):'#e8eef5'}} /></div></div>
                <div style={{width:30,textAlign:'right',fontSize:11,fontWeight:700,color:p?score_color(p):'var(--text3)'}}>{p!==null?`${p}%`:'—'}</div>
              </div>
            );
          })}
        </div>
        <div className="card" style={{padding:22}}>
          <div style={{fontSize:13,fontWeight:700,color:'var(--navy)',marginBottom:16}}>Recent Tests</div>
          {recent.map(s=>{
            const p=s.total>0?Math.round(s.score/s.total*100):0;
            return (
              <div key={s.id} style={{display:'flex',alignItems:'center',gap:12,padding:'9px 0',borderBottom:'1px solid #f5f7fa'}}>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,fontWeight:600,color:'var(--navy)'}}>{s.mode} · {s.total} Qs</div>
                  <div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>{fmt_date(s.date)} · {(s.categories||[]).slice(0,2).map(id=>cat_label(id).split(' ')[0]).join(', ')}{(s.categories||[]).length>2?` +${(s.categories||[]).length-2}`:''}</div>
                </div>
                <div style={{textAlign:'right'}}>
                  <div style={{fontSize:17,fontWeight:800,color:score_color(p),fontFamily:"'Libre Baskerville',serif"}}>{p}%</div>
                  <div style={{fontSize:10,color:'var(--text3)'}}>{s.score}/{s.total}</div>
                </div>
              </div>
            );
          })}
          <button className="btn btn-navy" style={{marginTop:16,width:'100%',justifyContent:'center'}} onClick={()=>setView('builder')}>Start New Test</button>
        </div>
      </div>
      {weak.length>0 && (
        <div className="card" style={{padding:'18px 22px',borderLeft:'3px solid var(--red)'}}>
          <div style={{fontSize:12,fontWeight:700,color:'var(--red)',marginBottom:10,textTransform:'uppercase',letterSpacing:'0.05em'}}>Focus Areas Needed</div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            {weak.map(c=>(
              <button key={c.id} className="btn btn-navy" style={{fontSize:11,padding:'6px 14px'}} onClick={()=>onDrillCat(c.id)}>
                Drill: {c.label} ({Math.round(catStats[c.id].correct/catStats[c.id].total*100)}%)
              </button>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ─── TEST BUILDER ────────────────────────────────────────────────────────────
function TestBuilder({ onStart, apiKey, setApiKey, initialConfig }) {
  const [mode, setMode] = useState(initialConfig?.mode||'Tutor');
  const [count, setCount] = useState(initialConfig?.count||15);
  const [cats, setCats] = useState(initialConfig?.cats||CATS.map(c=>c.id));
  const [localKey, setLocalKey] = useState(apiKey||HARDCODED_KEY||'');
  const allSel = cats.length===CATS.length;
  const toggleCat = id => setCats(p=>p.includes(id)?p.filter(c=>c!==id):[...p,id]);
  const MODES = [
    {id:'Tutor',   sub:'See answer after each question'},
    {id:'Timed',   sub:`${Math.round(count*1.5)} min limit — feedback at end`},
    {id:'Exam Sim',sub:'45 questions · 90 min · Full simulation'},

                    background:sel?'var(--navy)':'#f8fafc',border:sel?'1px solid var(--navy)':'1px solid var(--border)',
                    borderRadius:6,textAlign:'left',fontFamily:"'Karla',sans-serif"}}>
                  <div style={{width:7,height:7,borderRadius:'50%',background:sel?'var(--amber)':c.color,flexShrink:0}} />
                  <span style={{fontSize:12,fontWeight:600,color:sel?'#fff':'var(--navy)'}}>{c.label}</span>
                </button>
              );
            })}
          </div>
        </div>
      )}

      <button className="btn btn-amber" style={{width:'100%',justifyContent:'center',padding:'13px',fontSize:14,letterSpacing:'0.05em',textTransform:'uppercase'}}
        onClick={()=>onStart({mode,count:effectiveCount,cats:effectiveCats,apiKey:localKey||HARDCODED_KEY})}>
        Begin Test — {effectiveCount} Questions
      </button>
    </div>
  );
}

// ─── QUIZ ────────────────────────────────────────────────────────────────────
function QuizView({ config, onComplete, savedQs, setSavedQs, notes, setNotes }) {
  const [questions, setQuestions] = useState([]);
  const [loading, setLoading] = useState(true);
  const [loadMsg, setLoadMsg] = useState('Generating questions...');
  const [error, setError] = useState('');
  const [idx, setIdx] = useState(0);
  const [answers, setAnswers] = useState({});
  const [flagged, setFlagged] = useState({});
  const [revealed, setRevealed] = useState({});
  const [showNote, setShowNote] = useState(false);
  const [timeLeft, setTimeLeft] = useState(()=>config.mode==='Timed'?config.count*90:config.mode==='Exam Sim'?90*60:null);
  const [done, setDone] = useState(false);
  const timerRef = useRef(null);
  const startRef = useRef(Date.now());

  useEffect(()=>{genQuestions();},[]);

  useEffect(()=>{
    if(timeLeft===null||done)return;
    if(timeLeft<=0){submit(true);return;}
    timerRef.current=setTimeout(()=>setTimeLeft(t=>t-1),1000);
    return()=>clearTimeout(timerRef.current);
  },[timeLeft,done]);

  const genQuestions = async () => {
    setLoading(true); setError('');
    const {cats,count,apiKey} = config;
    const catLabels = cats.map(id=>CATS.find(c=>c.id===id)?.label).filter(Boolean);
    const batches=[]; const BS=25;
    for(let i=0;i<count;i+=BS)batches.push(Math.min(BS,count-i));
    try {
      let all=[];
      for(let b=0;b<batches.length;b++){
        const bc=batches[b];
        if(batches.length>1)setLoadMsg(`Generating batch ${b+1} of ${batches.length}...`);
        const prompt=`You are an expert NCLEX-RN question writer for the NGN format.

Generate exactly ${bc} high-quality NCLEX-RN questions on: ${catLabels.join(', ')}.

Requirements:
- Detailed clinical scenario (2-4 sentences), then a clear question
- 4 options (A-D), exactly ONE correct
- Vary difficulty: moderate and hard only
- Rationale: explain why correct answer is right AND why each wrong answer is wrong (4-6 sentences)
- Strategy: one concise NCLEX test-taking tip (1-2 sentences)
- Distribute evenly across categories
- Use clinical NGN-style language

Return ONLY valid JSON, no markdown:
{"questions":[{"id":1,"cat":"cat_id","category":"full name","difficulty":"moderate|hard","stem":"Scenario and question","options":["A","B","C","D"],"correct":0,"rationale":"...","strategy":"..."}]}

Valid cat IDs: mgmt, safety, health, psycho, basic, pharma, risk, physio`;
        const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:16000,messages:[{role:"user",content:prompt}]})});
        if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e?.error?.message||`API error ${res.status}`);}
        const data=await res.json();
        const text=data.content?.find(b=>b.type==='text')?.text||'';
        const parsed=JSON.parse(text.replace(/```json|```/g,'').trim());
        all=[...all,...(parsed.questions||[]).map((q,i)=>({...q,id:all.length+i+1}))];
      }
      setQuestions(all);
    } catch(e){setError('Failed: '+e.message);}
    finally{setLoading(false);}
  };

  const submit = useCallback((auto=false) => {
    clearTimeout(timerRef.current);
    const allRev={};
    questions.forEach(q=>{allRev[q.id]=true;});
    setRevealed(allRev);
    setDone(true);
    const elapsed=Math.round((Date.now()-startRef.current)/1000);
    const sessionData={
      id:Date.now().toString(),date:new Date().toISOString(),mode:config.mode,categories:config.cats,
      score:questions.filter(q=>answers[q.id]===q.correct).length,
      total:questions.length,timeSpent:elapsed,
      questions:questions.map(q=>({cat:q.cat,correct:answers[q.id]===q.correct,flagged:flagged[q.id]||false}))
    };
    const prev=S.get('nclex_sessions',[]);
    S.set('nclex_sessions',[...prev,sessionData]);
    onComplete(sessionData,questions,answers,flagged);
  },[questions,answers,flagged,config,onComplete]);

  const q = questions[idx];
  const qh = q?hash(q.stem):null;
  const noteText = qh?(notes[qh]||''):'';
  const isSaved = q?savedQs.some(s=>hash(s.stem)===hash(q.stem)):false;
  const isRev = q?!!revealed[q.id]:false;
  const userAns = q?answers[q.id]:undefined;
  const isCorrect = userAns===q?.correct;
  const answeredCount = Object.keys(answers).length;

  const toggleSave=()=>{
    if(!q)return;
    const h=hash(q.stem);
    if(isSaved){const u=savedQs.filter(s=>hash(s.stem)!==h);setSavedQs(u);S.set('nclex_saved_q',u);}
    else{const u=[...savedQs,{...q,savedAt:new Date().toISOString()}];setSavedQs(u);S.set('nclex_saved_q',u);}
  };
  const saveNote=text=>{if(!qh)return;const u={...notes,[qh]:text};setNotes(u);S.set('nclex_notes',u);};
  const revealCurrent=()=>{if(q&&userAns!==undefined)setRevealed(p=>({...p,[q.id]:true}));};

  if(loading) return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'80vh',gap:16}} className="fade-in">
      <div className="spinner" />
      <div style={{fontSize:14,fontWeight:600,color:'var(--navy)'}}>{loadMsg}</div>
      <div style={{fontSize:12,color:'var(--text3)'}}>Calibrating to {config.cats.length} categor{config.cats.length===1?'y':'ies'}</div>
    </div>
  );
  if(error) return (
    <div style={{maxWidth:540,margin:'80px auto',padding:'0 24px',textAlign:'center'}} className="fade-in">
      <div className="card" style={{padding:28}}>
        <div style={{color:'var(--red)',fontSize:14,marginBottom:16,lineHeight:1.6}}>{error}</div>
        <button className="btn btn-navy" onClick={genQuestions}>Retry</button>
      </div>
    </div>
  );
  if(!q)return null;

  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column'}} className="fade-in">
      {/* Header */}
      <div style={{background:'#fff',borderBottom:'1px solid var(--border)',padding:'10px 24px',display:'flex',alignItems:'center',gap:14,position:'sticky',top:0,zIndex:50}}>
        <div style={{fontSize:13,fontWeight:700,color:'var(--navy)',minWidth:60}}>
          {idx+1}<span style={{color:'var(--text3)',fontWeight:400}}> / {questions.length}</span>
        </div>
        <div style={{flex:1,padding:'0 8px'}}>
          <div className="pbar" style={{height:4}}>
            <div className="pfill" style={{width:`${((idx+1)/questions.length)*100}%`,background:'var(--navy)'}} />
          </div>
        </div>
        {timeLeft!==null && (
          <div style={{fontSize:13,fontWeight:700,color:timeLeft<300?'var(--red)':'var(--navy)',background:timeLeft<300?'var(--red-bg)':'#f0f4f8',padding:'4px 10px',borderRadius:5,minWidth:52,textAlign:'center'}}>
            {fmt_time(timeLeft)}
          </div>
        )}
        <span className="tag">{config.mode}</span>
        <button onClick={()=>setFlagged(f=>({...f,[q.id]:!f[q.id]}))}
          style={{fontSize:11,fontWeight:700,padding:'4px 10px',borderRadius:5,border:flagged[q.id]?'1px solid var(--amber)':'1px solid var(--border)',
            background:flagged[q.id]?'var(--yellow-bg)':'#f8fafc',color:flagged[q.id]?'var(--amber)':'var(--text3)',cursor:'pointer'}}>
          {flagged[q.id]?'Flagged':'Flag'}
        </button>
        <button onClick={toggleSave}
          style={{fontSize:11,fontWeight:700,padding:'4px 10px',borderRadius:5,border:isSaved?'1px solid var(--green)':'1px solid var(--border)',
            background:isSaved?'var(--green-bg)':'#f8fafc',color:isSaved?'var(--green)':'var(--text3)',cursor:'pointer'}}>
          {isSaved?'Saved':'Save'}
        </button>
        {!done && answeredCount===questions.length && (
          <button className="btn btn-amber" style={{fontSize:12,padding:'5px 14px'}} onClick={()=>submit(false)}>Submit</button>
        )}
      </div>

      {/* Body */}
      <div style={{flex:1,maxWidth:780,margin:'0 auto',width:'100%',padding:'28px 24px 60px'}} className="fade-in">
        <div style={{display:'flex',gap:8,marginBottom:14}}>
          <span className="tag">{q.category||cat_label(q.cat)}</span>
          {q.difficulty&&<span className="tag">{q.difficulty}</span>}
        </div>
        <div style={{fontSize:15,color:'var(--navy)',lineHeight:1.8,marginBottom:26,fontWeight:500}}>{q.stem}</div>
        <div style={{display:'flex',flexDirection:'column',gap:9,marginBottom:22}}>
          {q.options.map((opt,oi)=>{
            let cls='opt-btn';
            if(isRev){if(oi===q.correct)cls+=' right';else if(userAns===oi&&oi!==q.correct)cls+=' wrong';}
            else if(userAns===oi)cls+=' sel';
            return (
              <button key={oi} className={cls} onClick={()=>{if(!isRev)setAnswers(p=>({...p,[q.id]:oi}));}}>
                <span style={{fontWeight:800,fontSize:13,minWidth:18,flexShrink:0,color:'inherit'}}>{String.fromCharCode(65+oi)}.</span>
                <span style={{fontSize:14,lineHeight:1.6,flex:1}}>{opt}</span>
                {isRev&&oi===q.correct&&<span style={{fontSize:10,fontWeight:700,color:'var(--green)',flexShrink:0,marginLeft:8}}>CORRECT</span>}
                {isRev&&userAns===oi&&oi!==q.correct&&<span style={{fontSize:10,fontWeight:700,color:'var(--red)',flexShrink:0,marginLeft:8}}>YOUR ANSWER</span>}
              </button>
            );
          })}
        </div>

        {config.mode==='Tutor'&&!isRev&&(
          <button className="btn btn-navy" onClick={revealCurrent} disabled={userAns===undefined}
            style={{opacity:userAns===undefined?0.45:1,marginBottom:20,padding:'10px 22px'}}>Check Answer</button>
        )}

        {isRev&&(
          <div style={{marginBottom:20}} className="fade-in">
            <div style={{background:isCorrect?'var(--green-bg)':'var(--red-bg)',borderLeft:`3px solid ${isCorrect?'var(--green)':'var(--red)'}`,borderRadius:'0 6px 6px 0',padding:'14px 18px',marginBottom:10}}>
              <div style={{fontWeight:700,fontSize:13,color:isCorrect?'var(--green)':'var(--red)',marginBottom:6}}>
                {isCorrect?'Correct':`Incorrect — Correct: ${String.fromCharCode(65+q.correct)}`}
              </div>
              <div style={{fontSize:13,lineHeight:1.75,color:'#374151'}}>{q.rationale}</div>
            </div>
            <div style={{background:'#eff6ff',borderLeft:'3px solid #1e40af',borderRadius:'0 6px 6px 0',padding:'10px 18px',fontSize:13,color:'#1e40af',lineHeight:1.6}}>
              <strong>Strategy:</strong> {q.strategy}
            </div>
          </div>
        )}

        <div style={{marginBottom:22}}>
          <button onClick={()=>setShowNote(n=>!n)}
            style={{background:'none',border:'none',fontSize:12,color:'var(--text3)',fontWeight:600,cursor:'pointer',padding:0}}>
            {showNote?'Hide note':noteText?'View note':'+ Add note'}
          </button>
          {showNote&&(
            <textarea rows={3} placeholder="Notes for this question..." value={noteText}
              onChange={e=>saveNote(e.target.value)} style={{marginTop:8,display:'block'}} className="fade-in" />
          )}
        </div>

        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',paddingTop:16,borderTop:'1px solid #f0f4f8',marginBottom:20}}>
          <button className="btn btn-ghost" onClick={()=>setIdx(i=>i-1)} disabled={idx===0} style={{opacity:idx===0?0.35:1}}>Previous</button>
          <div style={{fontSize:12,color:'var(--text3)'}}>{answeredCount} of {questions.length} answered</div>
          {idx<questions.length-1?(
            <button className="btn btn-navy" onClick={()=>setIdx(i=>i+1)}>Next</button>
          ):(
            !done&&<button className="btn btn-amber" onClick={()=>{
              const left=questions.length-answeredCount;
              if(left>0&&!window.confirm(`${left} unanswered. Submit anyway?`))return;
              submit(false);
            }}>Submit Test</button>
          )}
        </div>

        <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
          {questions.map((q2,i)=>{
            const isF=flagged[q2.id];
            const isA=answers[q2.id]!==undefined;
            let cls='num-flag';
            if(i===idx)cls+=' cur';
            else if(isF)cls+=' flg';
            else if(isA)cls+=' ans';
            return <button key={i} className={cls} onClick={()=>setIdx(i)}>{i+1}</button>;
          })}
        </div>
      </div>
    </div>
  );
}

// ─── REVIEW ──────────────────────────────────────────────────────────────────
function ReviewView({ session, questions, answers, flagged, onNewTest, onRetake }) {
  const [filter, setFilter] = useState('all');
  const [exp, setExp] = useState(null);
  const pct = session.total>0?Math.round(session.score/session.total*100):0;
  const incorrect = questions.filter(q=>answers[q.id]!==q.correct);
  const flgList = questions.filter(q=>flagged[q.id]);
  const filtered = filter==='incorrect'?incorrect:filter==='flagged'?flgList:questions;

  return (
    <div style={{maxWidth:800,margin:'0 auto',padding:'32px 24px'}} className="fade-in">
      <div className="card" style={{padding:'26px 30px',marginBottom:22,background:'var(--navy)',border:'none',color:'#fff',borderLeft:'4px solid var(--amber)'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:16}}>
          <div>
            <div style={{fontSize:10,letterSpacing:3,opacity:0.5,textTransform:'uppercase',marginBottom:6}}>Test Complete</div>
            <div style={{fontSize:44,fontWeight:800,fontFamily:"'Libre Baskerville',serif",color:pct>=70?'#4ade80':pct>=50?'#fbbf24':'#f87171',lineHeight:1}}>{pct}%</div>
            <div style={{opacity:0.65,fontSize:13,marginTop:5}}>{session.score} of {session.total} correct · {session.mode}{session.timeSpent?` · ${fmt_time(session.timeSpent)}`:''}</div>
          </div>
          <div style={{display:'flex',gap:10,alignItems:'flex-start',marginTop:4}}>
            <button className="btn btn-ghost" style={{color:'rgba(255,255,255,0.7)',borderColor:'rgba(255,255,255,0.2)'}} onClick={onNewTest}>New Test</button>
            <button className="btn btn-amber" onClick={onRetake}>Retake</button>
          </div>
        </div>
      </div>

      <div style={{display:'flex',gap:8,marginBottom:20}}>
        {[['all',`All (${questions.length})`],['incorrect',`Incorrect (${incorrect.length})`],['flagged',`Flagged (${flgList.length})`]].map(([f,l])=>(
          <button key={f} onClick={()=>setFilter(f)}
            style={{padding:'7px 15px',border:filter===f?'2px solid var(--navy)':'1px solid var(--border)',borderRadius:6,
              background:filter===f?'var(--navy)':'#fff',color:filter===f?'#fff':'var(--text2)',fontSize:13,fontWeight:600,cursor:'pointer'}}>
            {l}
          </button>
        ))}
      </div>

      {filtered.map(q=>{
        const ua=answers[q.id]; const ic=ua===q.correct; const isE=exp===q.id;
        return (
          <div key={q.id} className="card" style={{marginBottom:10,borderTop:`2px solid ${ic?'var(--green)':'var(--red)'}`}}>
            <button onClick={()=>setExp(isE?null:q.id)}
              style={{width:'100%',padding:'13px 18px',display:'flex',gap:12,alignItems:'flex-start',background:'none',border:'none',textAlign:'left',cursor:'pointer'}}>
              <span style={{fontWeight:800,fontSize:12,color:ic?'var(--green)':'var(--red)',minWidth:16,flexShrink:0,marginTop:1}}>{ic?'C':'X'}</span>
              <div style={{flex:1}}>
                <div style={{fontSize:13,color:'var(--navy)',lineHeight:1.5}}>{q.stem.substring(0,130)}{q.stem.length>130?'...':''}</div>
                <div style={{display:'flex',gap:6,marginTop:5,flexWrap:'wrap'}}>
                  <span className="tag">{q.category||cat_label(q.cat)}</span>
                  {q.difficulty&&<span className="tag">{q.difficulty}</span>}
                  {flagged[q.id]&&<span className="tag" style={{color:'var(--amber)'}}>Flagged</span>}
                </div>
              </div>
              <span style={{color:'var(--text3)',fontSize:11,flexShrink:0,marginTop:2}}>{isE?'▲':'▼'}</span>
            </button>
            {isE&&(
              <div style={{padding:'0 18px 18px'}} className="fade-in">
                <div style={{fontSize:14,color:'var(--navy)',lineHeight:1.75,marginBottom:16}}>{q.stem}</div>
                {q.options.map((opt,oi)=>(
                  <div key={oi} style={{display:'flex',gap:10,padding:'9px 12px',marginBottom:7,borderRadius:6,
                    background:oi===q.correct?'var(--green-bg)':ua===oi&&oi!==q.correct?'var(--red-bg)':'#fafbfc',
                    border:`1px solid ${oi===q.correct?'var(--green-b)':ua===oi&&oi!==q.correct?'var(--red-b)':'var(--border)'}`}}>
                    <span style={{fontWeight:800,fontSize:13,color:oi===q.correct?'var(--green)':ua===oi&&oi!==q.correct?'var(--red)':'var(--text3)',minWidth:18}}>{String.fromCharCode(65+oi)}.</span>
                    <span style={{fontSize:13,color:'#374151',flex:1,lineHeight:1.6}}>{opt}</span>
                    {oi===q.correct&&<span style={{fontSize:10,fontWeight:700,color:'var(--green)',flexShrink:0}}>CORRECT</span>}
                    {ua===oi&&oi!==q.correct&&<span style={{fontSize:10,fontWeight:700,color:'var(--red)',flexShrink:0}}>YOUR ANSWER</span>}
                  </div>
                ))}
                <div style={{background:'var(--green-bg)',borderLeft:'3px solid var(--green)',borderRadius:'0 6px 6px 0',padding:'13px 16px',marginTop:12,fontSize:13,color:'#374151',lineHeight:1.75}}>
                  <strong style={{color:'var(--green)'}}>Rationale:</strong> {q.rationale}
                </div>
                <div style={{background:'#eff6ff',borderLeft:'3px solid #1e40af',borderRadius:'0 6px 6px 0',padding:'10px 16px',marginTop:8,fontSize:12,color:'#1e40af',lineHeight:1.6}}>
                  <strong>Strategy:</strong> {q.strategy}
                </div>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ─── ANALYTICS ───────────────────────────────────────────────────────────────
function Analytics({ sessions }) {
  if(!sessions.length) return (
    <div style={{maxWidth:540,margin:'80px auto',padding:'0 24px',textAlign:'center'}}>
      <div style={{fontSize:14,color:'var(--text3)'}}>Complete a test to see your analytics.</div>
    </div>
  );
  const catStats={};
  CATS.forEach(c=>{catStats[c.id]={correct:0,total:0};});
  sessions.forEach(s=>(s.questions||[]).forEach(q=>{if(catStats[q.cat]){catStats[q.cat].total++;if(q.correct)catStats[q.cat].correct++;}}));
  const tQ=sessions.reduce((a,s)=>a+s.total,0);
  const tC=sessions.reduce((a,s)=>a+s.score,0);
  const overall=Math.round(tC/tQ*100);
  const trend=[...sessions].sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(-12).map(s=>({date:fmt_date(s.date),pct:s.total>0?Math.round(s.score/s.total*100):0}));
  const maxP=Math.max(...trend.map(d=>d.pct),100);

  return (
    <div style={{maxWidth:960,margin:'0 auto',padding:'32px 24px'}} className="fade-in">
      <h2 style={{fontSize:19,marginBottom:22}}>Performance Analytics</h2>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:14,marginBottom:22}}>
        {[
          {l:'Overall Score',v:`${overall}%`,c:score_color(overall)},
          {l:'Total Questions',v:tQ,c:'var(--navy)'},
          {l:'Tests Taken',v:sessions.length,c:'var(--teal)'},
          {l:'Avg / Test',v:Math.round(tQ/sessions.length),c:'var(--amber)'},
        ].map(s=>(
          <div key={s.l} className="card" style={{padding:'16px',textAlign:'center',borderTop:`3px solid ${s.c}`}}>
            <div style={{fontSize:26,fontWeight:800,color:s.c,fontFamily:"'Libre Baskerville',serif",lineHeight:1}}>{s.v}</div>
            <div style={{fontSize:10,color:'var(--text3)',fontWeight:700,marginTop:5,textTransform:'uppercase',letterSpacing:'0.05em'}}>{s.l}</div>
          </div>
        ))}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,marginBottom:20}}>
        <div className="card" style={{padding:22}}>
          <div style={{fontSize:13,fontWeight:700,color:'var(--navy)',marginBottom:20}}>Score Trend (Last {trend.length} Tests)</div>
          <div style={{display:'flex',alignItems:'flex-end',gap:4,height:110,position:'relative',paddingBottom:20}}>
            <div style={{position:'absolute',bottom:20+(60/maxP)*90,left:0,right:0,borderTop:'1px dashed #e0e8f0',zIndex:0}}>
              <span style={{position:'absolute',right:0,top:-16,fontSize:9,color:'var(--text3)',background:'#fff',padding:'0 3px'}}>60%</span>
            </div>
            {trend.map((d,i)=>{
              const bc=score_color(d.pct);
              return (
                <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3,zIndex:1}}>
                  <div style={{fontSize:9,fontWeight:700,color:bc}}>{d.pct}%</div>
                  <div style={{width:'100%',background:bc,borderRadius:'3px 3px 0 0',height:`${(d.pct/maxP)*90}px`,minHeight:3,transition:'height 0.5s'}} />
                  <div style={{fontSize:9,color:'var(--text3)',writingMode:'vertical-rl',transform:'rotate(180deg)',height:18,overflow:'hidden'}}>{d.date}</div>
                </div>
              );
            })}
          </div>
        </div>
        <div className="card" style={{padding:22}}>
          <div style={{fontSize:13,fontWeight:700,color:'var(--navy)',marginBottom:16}}>Category Breakdown</div>
          {CATS.map(c=>{
            const s=catStats[c.id]; if(!s.total)return null;
            const p=Math.round(s.correct/s.total*100); const bc=score_color(p);
            return (
              <div key={c.id} style={{marginBottom:11}}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                  <span style={{fontSize:11,color:'var(--text2)'}}>{c.label}</span>
                  <span style={{fontSize:11,fontWeight:700,color:bc}}>{p}% <span style={{color:'var(--text3)',fontWeight:400}}>({s.correct}/{s.total})</span></span>
                </div>
                <div className="pbar"><div className="pfill" style={{width:`${p}%`,background:bc}} /></div>
              </div>
            );
          })}
        </div>
      </div>
      <div className="card" style={{padding:22}}>
        <div style={{fontSize:13,fontWeight:700,color:'var(--navy)',marginBottom:14}}>Session History</div>
        <table>
          <thead><tr>{['Date','Mode','Score','Questions','Time'].map(h=><th key={h}>{h}</th>)}</tr></thead>
          <tbody>
            {[...sessions].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(s=>{
              const p=s.total>0?Math.round(s.score/s.total*100):0;
              return (
                <tr key={s.id}>
                  <td>{fmt_date(s.date)}</td>
                  <td><span className="tag">{s.mode}</span></td>
                  <td style={{fontWeight:700,color:score_color(p)}}>{p}%</td>
                  <td>{s.score}/{s.total}</td>
                  <td>{s.timeSpent?fmt_time(s.timeSpent):'—'}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ─── STRATEGY ────────────────────────────────────────────────────────────────
function StrategyGuide() {
  const [open, setOpen] = useState(null);
  const items=[
    {t:'NCLEX Decision Tree',c:`Apply this sequence to every priority question:
1. ABCs first — Airway > Breathing > Circulation always wins
2. Safety next — any imminent safety risk trumps comfort
3. Maslow's Hierarchy — Physiological before Psychosocial
4. Nursing Process — Assess/gather data before acting
5. Acute over Chronic — new or worsening problems take precedence
6. Actual over Potential — existing problems before risk problems
When two options both seem correct, choose the one that assesses before the one that intervenes.`},
    {t:'SATA — Select All That Apply',c:`Treat every option as an independent True/False question.
• Do NOT look at how many others you've chosen — each option stands alone
• 2–3 correct answers is most common; occasionally 4 or 5
• Absolute words (always, never, only) signal false options
• Safety-related options are usually correct
• If uncertain, ask: "Would a reasonable nurse do this for this patient?"
• Eliminate clearly wrong options first, then evaluate remaining`},
    {t:'Priority & Delegation',c:`RN: Initial assessments, unstable/complex patients, IV push meds, care planning, teaching, evaluation of outcomes.
LPN: Stable chronic conditions, predictable outcomes, NG tube feedings, wound care, oral/IM/SQ medications.
UAP: Basic ADLs (bathing, feeding, ambulating stable patients), vital signs on stable patients, I&O, transport.

Never delegate to UAP: Anything requiring nursing judgment, assessment, or clinical decision-making.
Never delegate to LPN: Fresh post-op patients, unstable vitals, new assessments, IV push medications.`},
    {t:'Isolation Precautions',c:`CONTACT (gown + gloves): C. diff, MRSA, VRE, RSV, scabies, wound infections
→ C. diff = SOAP and water only, alcohol gel is INEFFECTIVE

DROPLET (surgical mask within 3 feet): Influenza, meningitis (bacterial), mumps, rubella, pertussis, epiglottitis

AIRBORNE (N95 + negative pressure room): TB, varicella/chickenpox, measles, disseminated zoster
→ Remember: "MTV" — Measles, TB, Varicella

PROTECTIVE/REVERSE: Neutropenic patients — protect FROM environment (mask for visitors, filtered air, no fresh flowers/produce)`},
    {t:'Critical Lab Values',c:`Sodium: 135–145 | Critical: <120 or >160 mEq/L
Potassium: 3.5–5.0 | Critical: <2.5 or >6.5 mEq/L → dysrhythmias
Glucose: 70–100 fasting | Critical: <50 or >500 mg/dL
pH: 7.35–7.45 | PaCO2: 35–45 | HCO3: 22–26
Creatinine: 0.6–1.2 mg/dL (elevated = kidney dysfunction)
INR therapeutic: 2–3 (A-fib), 2.5–3.5 (mechanical heart valve)
Digoxin therapeutic: 0.5–2 ng/mL | HOLD if apical pulse <60 bpm (adult)
Lithium therapeutic: 0.6–1.2 mEq/L | Toxic: >1.5 mEq/L
PTT therapeutic (heparin): 60–100 seconds (1.5–2.5× normal)`},
    {t:'NGN Clinical Judgment Model',c:`6-step framework for all NGN question types:
1. RECOGNIZE CUES — What data is abnormal? What's a change from baseline?
2. ANALYZE CUES — What do these cues mean together? What's the clinical significance?
3. PRIORITIZE HYPOTHESES — What's the most likely (or most dangerous) explanation?
4. GENERATE SOLUTIONS — What evidence-based interventions apply?
5. TAKE ACTIONS — Implement in priority order (ABCs, urgency)
6. EVALUATE OUTCOMES — Did the intervention produce expected results?

NGN Question Types: Bow-tie, Matrix/Grid, Trend, Extended drag-and-drop, Highlight text, Drop-down menus
Bow-tie format: Cause → Central condition → Nursing action/expected outcome`},
    {t:'Test-Day Strategy',c:`Timing: 5-minute rule — flag anything taking >3 minutes and return.
Do not change answers unless you have a specific clinical reason.
Read the question stem twice before reading options.
Look for keywords: priority, first, most appropriate, best, immediate.
Eliminate obvious wrong answers; choose between the final two using ABCs/safety.
Never assume you failed during the test — the CAT algorithm adjusts difficulty based on performance.
Post-test: No Quick Results for 48 hours. If you got 85 questions, that means either clear pass or clear fail — likely pass.`},
  ];
  return (
    <div style={{maxWidth:680,margin:'0 auto',padding:'32px 24px'}} className="fade-in">
      <h2 style={{fontSize:19,marginBottom:6}}>Study Strategies</h2>
      <p style={{color:'var(--text2)',fontSize:14,marginBottom:22}}>Core frameworks, priority rules, and clinical judgment guides.</p>
      {items.map((item,i)=>(
        <div key={i} className="card" style={{marginBottom:10}}>
          <button onClick={()=>setOpen(open===i?null:i)}
            style={{width:'100%',padding:'15px 20px',display:'flex',justifyContent:'space-between',alignItems:'center',background:'none',border:'none',textAlign:'left',cursor:'pointer'}}>
            <span style={{fontWeight:700,fontSize:14,color:'var(--navy)'}}>{item.t}</span>
            <span style={{color:'var(--text3)',fontSize:11}}>{open===i?'▲':'▼'}</span>
          </button>
          {open===i&&(
            <div style={{padding:'0 20px 18px'}} className="fade-in">
              <pre style={{fontSize:13,color:'#374151',lineHeight:1.85,whiteSpace:'pre-wrap',fontFamily:"'Karla',sans-serif",margin:0}}>{item.c}</pre>
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

// ─── DIAGNOSTIC VIEW ─────────────────────────────────────────────────────────
function DiagnosticView({ onComplete, setView }) {
  const [phase, setPhase] = useState('intro'); // intro | quiz | results
  const [idx, setIdx] = useState(0);
  const [answers, setAnswers] = useState({});
  const [scores, setScores] = useState({});
  const [weakArea, setWeakArea] = useState(null);

  const calcScores = (ans) => {
    const s = {};
    CATS.forEach(c=>{s[c.id]={correct:0,total:0};});
    DIAG_QS.forEach(q=>{if(ans[q.id]!==undefined){s[q.cat].total++;if(ans[q.id]===q.correct)s[q.cat].correct++;}});
    return s;
  };

  const finish = (ans) => {
    const s = calcScores(ans);
    setScores(s);
    let worst=null, worstPct=1;
    Object.entries(s).forEach(([id,v])=>{if(v.total>0){const p=v.correct/v.total;if(p<worstPct){worstPct=p;worst=id;}}});
    setWeakArea(worst);
    setPhase('results');
    onComplete(worst, s);
  };

  const q = DIAG_QS[idx];
  const totalCorrect = Object.values(scores).reduce((a,v)=>a+v.correct,0);
  const pct = Math.round(totalCorrect/DIAG_QS.length*100);

  if(phase==='intro') return (
    <div style={{maxWidth:620,margin:'0 auto',padding:'40px 24px'}} className="fade-in">
      <div className="card" style={{padding:'32px 36px',borderLeft:'4px solid var(--navy)'}}>
        <div style={{width:52,height:52,background:'var(--navy)',borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',marginBottom:20}}>
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        </div>
        <h2 style={{margin:'0 0 10px',fontSize:22}}>NCLEX Diagnostic Assessment</h2>
        <p style={{color:'var(--text2)',fontSize:14,lineHeight:1.75,marginBottom:24}}>
          20 questions across all 8 NCLEX categories. Takes about 15 minutes. Your results identify weak areas and automatically generate a personalized study plan.
        </p>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:24}}>
          {[['20 Questions','Covers all 8 categories'],['Instant Analysis','Category-level scoring'],['Study Plan','Auto-generated roadmap'],['No API Key','Pre-built question bank']].map(([t,d])=>(
            <div key={t} style={{background:'#f8fafc',borderRadius:6,padding:'12px 14px',border:'1px solid var(--border)'}}>
              <div style={{fontWeight:700,fontSize:12,color:'var(--navy)',marginBottom:2}}>{t}</div>
              <div style={{fontSize:11,color:'var(--text3)'}}>{d}</div>
            </div>
          ))}
        </div>
        <button className="btn btn-navy" style={{width:'100%',justifyContent:'center',padding:'12px',fontSize:14}} onClick={()=>setPhase('quiz')}>
          Begin Diagnostic
        </button>
      </div>
    </div>
  );

  if(phase==='quiz') return (
    <div style={{maxWidth:720,margin:'0 auto',padding:'28px 24px'}} className="fade-in">
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:20}}>
        <div style={{fontSize:13,fontWeight:700,color:'var(--navy)',minWidth:60}}>{idx+1}<span style={{color:'var(--text3)',fontWeight:400}}> / {DIAG_QS.length}</span></div>
        <div style={{flex:1}}><div className="pbar" style={{height:4}}><div className="pfill" style={{width:`${((idx+1)/DIAG_QS.length)*100}%`,background:'var(--navy)'}} /></div></div>
        <span className="tag">{cat_label(q.cat)}</span>
      </div>
      <div className="card" style={{padding:'26px 28px'}}>
        <p style={{fontSize:15,color:'var(--navy)',lineHeight:1.8,marginBottom:22,fontWeight:500}}>{q.stem}</p>
        <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:20}}>
          {q.options.map((opt,oi)=>(
            <button key={oi} className={`opt-btn${answers[q.id]===oi?' sel':''}`}
              onClick={()=>setAnswers(p=>({...p,[q.id]:oi}))}>
              <span style={{fontWeight:800,fontSize:13,minWidth:18,flexShrink:0}}>{String.fromCharCode(65+oi)}.</span>
              <span style={{fontSize:14,lineHeight:1.6}}>{opt}</span>
            </button>
          ))}
        </div>
        <div style={{display:'flex',justifyContent:'space-between'}}>
          <button className="btn btn-ghost" onClick={()=>setIdx(i=>i-1)} disabled={idx===0} style={{opacity:idx===0?0.4:1}}>Previous</button>
          {idx<DIAG_QS.length-1
            ? <button className="btn btn-navy" onClick={()=>setIdx(i=>i+1)} disabled={answers[q.id]===undefined} style={{opacity:answers[q.id]===undefined?0.4:1}}>Next</button>
            : <button className="btn btn-amber" onClick={()=>finish(answers)} disabled={Object.keys(answers).length<DIAG_QS.length} style={{opacity:Object.keys(answers).length<DIAG_QS.length?0.4:1}}>Submit</button>
          }
        </div>
      </div>
    </div>
  );

  // Results
  const weakCat = CATS.find(c=>c.id===weakArea);
  return (
    <div style={{maxWidth:800,margin:'0 auto',padding:'28px 24px'}} className="fade-in">
      <div className="card" style={{padding:'26px 30px',marginBottom:20,background:'var(--navy)',border:'none',color:'#fff',borderLeft:'4px solid var(--amber)'}}>
        <div style={{fontSize:10,letterSpacing:3,opacity:0.5,textTransform:'uppercase',marginBottom:8}}>Diagnostic Complete</div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',flexWrap:'wrap',gap:12}}>
          <div>
            <div style={{fontSize:48,fontWeight:800,fontFamily:"'Libre Baskerville',serif",color:pct>=70?'#4ade80':pct>=50?'#fbbf24':'#f87171',lineHeight:1}}>{pct}%</div>
            <div style={{opacity:0.65,fontSize:13,marginTop:4}}>{totalCorrect} of {DIAG_QS.length} correct</div>
          </div>
          <div style={{display:'flex',gap:10}}>
            <button className="btn btn-ghost" style={{color:'rgba(255,255,255,0.7)',borderColor:'rgba(255,255,255,0.2)'}} onClick={()=>{setPhase('intro');setAnswers({});setIdx(0);}}>Retake</button>
            <button className="btn btn-amber" onClick={()=>setView('studyplan')}>View Study Plan</button>
          </div>
        </div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,marginBottom:20}}>
        <div className="card" style={{padding:22}}>
          <div style={{fontSize:13,fontWeight:700,color:'var(--navy)',marginBottom:14}}>Category Scores</div>
          {CATS.map(c=>{
            const s=scores[c.id]||{correct:0,total:0}; if(!s.total)return null;
            const p=Math.round(s.correct/s.total*100);
            return (
              <div key={c.id} style={{marginBottom:10}}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:3}}>
                  <span style={{fontSize:11,color:'var(--text2)'}}>{c.label}</span>
                  <span style={{fontSize:11,fontWeight:700,color:score_color(p)}}>{p}% ({s.correct}/{s.total})</span>
                </div>
                <div className="pbar"><div className="pfill" style={{width:`${p}%`,background:score_color(p)}} /></div>
              </div>
            );
          })}
        </div>
        <div>
          {weakCat && (
            <div className="card" style={{padding:20,marginBottom:14,borderLeft:'3px solid var(--red)'}}>
              <div style={{fontSize:11,fontWeight:700,color:'var(--red)',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:6}}>Priority Focus</div>
              <div style={{fontSize:14,fontWeight:700,color:'var(--navy)',marginBottom:6}}>{weakCat.label}</div>
              <div style={{fontSize:13,color:'var(--text2)',lineHeight:1.6,marginBottom:12}}>Your weakest category. Your study plan has been tailored to drill this area in Week 1.</div>
              <button className="btn btn-navy" style={{fontSize:12,width:'100%',justifyContent:'center'}} onClick={()=>setView('studyplan')}>See Personalized Plan</button>
            </div>
          )}
          <div className="card" style={{padding:20,borderLeft:'3px solid var(--amber)'}}>
            <div style={{fontSize:11,fontWeight:700,color:'var(--amber)',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:6}}>Next Step</div>
            <div style={{fontSize:13,color:'var(--text2)',lineHeight:1.6,marginBottom:12}}>Start drilling your weak categories with AI-generated questions tailored to your scores.</div>
            <button className="btn btn-amber" style={{fontSize:12,width:'100%',justifyContent:'center'}} onClick={()=>setView('builder')}>Start Targeted Practice</button>
          </div>
        </div>
      </div>

      <div className="card" style={{padding:22}}>
        <div style={{fontSize:13,fontWeight:700,color:'var(--navy)',marginBottom:14}}>Answer Review</div>
        {DIAG_QS.map((q2,i)=>{
          const ua=answers[q2.id]; const ic=ua===q2.correct;
          return (
            <div key={q2.id} style={{padding:'12px 0',borderBottom:'1px solid #f5f7fa'}}>
              <div style={{display:'flex',gap:10,alignItems:'flex-start',marginBottom:ic?0:6}}>
                <span style={{fontWeight:700,fontSize:11,minWidth:22,color:ic?'var(--green)':'var(--red)'}}>{ic?'C':'X'}</span>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,color:'var(--navy)',lineHeight:1.5,marginBottom:4}}>{q2.stem.substring(0,110)}...</div>
                  <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:4}}>
                    <span className="tag">{cat_label(q2.cat)}</span>
                  </div>
                  {!ic && <div style={{fontSize:12,color:'var(--green)',marginBottom:4}}>Correct: {q2.options[q2.correct]}</div>}
                  <div style={{fontSize:12,color:'var(--text3)',background:'#f8fafc',padding:'8px 10px',borderRadius:4,lineHeight:1.6,borderLeft:'2px solid var(--border)'}}>{q2.rationale}</div>
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── NGN GUIDE ────────────────────────────────────────────────────────────────
function NGNGuide() {
  return (
    <div style={{maxWidth:880,margin:'0 auto',padding:'32px 24px'}} className="fade-in">
      <div className="card" style={{padding:'26px 30px',marginBottom:22,background:'var(--navy)',border:'none',color:'#fff',borderLeft:'4px solid var(--amber)'}}>
        <div style={{fontSize:10,letterSpacing:3,opacity:0.5,textTransform:'uppercase',marginBottom:6}}>Launched April 2023</div>
        <h2 style={{fontSize:21,color:'#fff',marginBottom:6}}>Next Generation NCLEX (NGN) Guide</h2>
        <p style={{opacity:0.75,fontSize:14,margin:0}}>Master the Clinical Judgment question formats. NGN uses partial-credit scoring and six new question types.</p>
      </div>

      <div className="card" style={{padding:24,marginBottom:16}}>
        <h3 style={{margin:'0 0 16px',fontSize:16}}>Clinical Judgment Measurement Model (CJMM)</h3>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10}}>
          {[
            {n:1,t:'Recognize Cues',d:'Filter relevant from irrelevant information. What is abnormal? What has changed from baseline?',c:'#0891b2'},
            {n:2,t:'Analyze Cues',d:'Connect cues to clinical conditions. What do these findings mean together? Clinical significance?',c:'#7c3aed'},
            {n:3,t:'Prioritize Hypotheses',d:'Rank potential conditions by urgency and likelihood. What is most dangerous right now?',c:'#dc2626'},
            {n:4,t:'Generate Solutions',d:'Identify evidence-based interventions for each hypothesis. What nursing actions apply?',c:'#b45309'},
            {n:5,t:'Take Actions',d:'Implement interventions in priority order using ABCs, safety, and nursing process.',c:'#166534'},
            {n:6,t:'Evaluate Outcomes',d:'Assess client response. Is the client improving or deteriorating? Are goals being met?',c:'#0e7490'},
          ].map(s=>(
            <div key={s.n} style={{background:'#f8fafc',borderRadius:6,padding:'14px',borderTop:`3px solid ${s.c}`}}>

              <div style={{fontWeight:700,fontSize:13,color:'var(--navy)',marginBottom:4}}>{s.t}</div>
              <div style={{fontSize:12,color:'var(--text2)',lineHeight:1.6}}>{s.d}</div>
            </div>
          ))}
        </div>
      </div>

      <div className="card" style={{padding:24,marginBottom:16}}>
        <h3 style={{margin:'0 0 16px',fontSize:16}}>6 NGN Question Types</h3>
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          {NGNTIPS.map(t=>(
            <div key={t.type} style={{display:'flex',gap:14,padding:'14px 16px',background:'#f8fafc',borderRadius:6,borderLeft:`3px solid ${t.color}`}}>
              <div style={{flex:1}}>
                <div style={{fontWeight:700,fontSize:14,color:'var(--navy)',marginBottom:4}}>{t.type}</div>
                <div style={{fontSize:13,color:'var(--text2)',lineHeight:1.65}}>{t.desc}</div>
